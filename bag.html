<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Gimas Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-zinc-50 text-neutral-900 min-h-screen flex flex-col antialiased"
  >
    <header
      class="bg-[#1A1A1A] shadow-md sticky top-0 z-50 py-4 transition-all duration-300"
    >
      <nav
        class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between items-center"
      >
        <a
          href="./index.html"
          class="flex items-center gap-3 group transition-transform active:scale-95"
        >
          <img
            src="images/white.png"
            class="h-10 w-auto object-contain transition-transform duration-300 group-hover:scale-105"
            alt="logo"
          />
        </a>
        <a
          href="./index.html"
          class="text-neutral-300 hover:text-amber-500 transition-colors font-semibold text-xs tracking-widest flex items-center gap-2 group"
        >
          <i
            class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"
          ></i>
          CONTINUE SHOPPING
        </a>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12 flex-1 w-full">
      <h1
        class="text-3xl md:text-4xl font-extrabold mb-10 flex items-center gap-4 tracking-tight"
      >
        <i class="fa-solid fa-bag-shopping text-amber-500 animate-pulse"></i>
        Your Shopping Bag
      </h1>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-10 items-start">
        <div id="cart-items-container" class="lg:col-span-2 space-y-6"></div>

        <div class="lg:col-span-1 space-y-8">
          <div
            class="bg-white p-6 sm:p-8 rounded-3xl border border-neutral-100 shadow-sm transition-all"
          >
            <h2
              class="text-xl font-bold text-neutral-800 mb-6 flex items-center gap-2"
            >
              <i class="fa-regular fa-address-card text-neutral-400"></i>
              Delivery Information
            </h2>

            <form id="customer-form" class="space-y-5">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                  >
                    Full Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="fullName"
                    required
                    placeholder="John Doe"
                    class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 placeholder-neutral-400 text-sm transition-all"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                  >
                    Phone Number <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="tel"
                    id="phone"
                    required
                    placeholder="+60123456789"
                    class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 placeholder-neutral-400 text-sm transition-all"
                  />
                </div>
              </div>

              <div>
                <label
                  class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                >
                  Email Address <span class="text-red-500">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  required
                  placeholder="name@domain.com"
                  class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 placeholder-neutral-400 text-sm transition-all"
                />
              </div>

              <div>
                <label
                  class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                >
                  Shipping Address <span class="text-red-500">*</span>
                </label>
                <textarea
                  id="address"
                  rows="3"
                  required
                  placeholder="Street name, Unit/Apt number..."
                  class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 placeholder-neutral-400 text-sm resize-none transition-all"
                ></textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                  >
                    City <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="city"
                    required
                    placeholder="Kuala Lumpur"
                    class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 text-sm transition-all"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                  >
                    Postal Code <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="postalCode"
                    required
                    placeholder="50000"
                    class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl focus:outline-none focus:border-neutral-900 focus:ring-1 focus:ring-neutral-900 text-sm transition-all"
                  />
                </div>
              </div>

              <div>
                <label
                  class="block text-xs font-semibold uppercase tracking-wider text-neutral-500 mb-2"
                >
                  Country
                </label>
                <input
                  type="text"
                  id="country"
                  value="Malaysia"
                  class="w-full px-4 py-3.5 border border-neutral-200 rounded-2xl bg-neutral-50 font-medium text-neutral-600 text-sm focus:outline-none cursor-default"
                  readonly
                />
              </div>
            </form>
          </div>

          <div
            class="bg-white p-6 sm:p-8 rounded-3xl border border-neutral-100 shadow-sm sticky top-28"
          >
            <h2 class="text-xl font-bold text-neutral-800 mb-6">
              Order Summary
            </h2>

            <div class="space-y-4 text-sm">
              <div class="flex justify-between items-center text-neutral-600">
                <span id="subtotal-label">Subtotal (0 items)</span>
                <span id="subtotal-price" class="font-semibold text-neutral-900"
                  >RM 0.00</span
                >
              </div>
              <div class="flex justify-between items-center text-neutral-600">
                <span>Shipping Fee</span>
                <span
                  id="shipping-price"
                  class="text-emerald-600 font-bold bg-emerald-50 px-2.5 py-1 rounded-lg text-xs tracking-wide"
                  >FREE</span
                >
              </div>
              <div class="h-px bg-neutral-100 my-2"></div>
              <div
                class="flex justify-between items-center text-base font-bold text-neutral-900 pt-2"
              >
                <span>Estimated Total</span>
                <span
                  id="total-price"
                  class="text-xl font-black text-neutral-900"
                  >RM 0.00</span
                >
              </div>
            </div>

            <button
              onclick="handleCheckout()"
              id="checkout-btn"
              class="w-full mt-8 bg-neutral-950 text-white py-4 rounded-2xl font-bold text-base hover:bg-neutral-800 active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-md disabled:bg-neutral-200 disabled:text-neutral-400 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
            >
              COMPLETE ORDER
            </button>

            <p
              class="text-center text-xs text-neutral-400 mt-5 flex items-center justify-center gap-1.5"
            >
              <i class="fa-solid fa-lock text-[10px]"></i> Secure Checkout
              Process
            </p>
          </div>
        </div>
      </div>
    </main>

    <script>
      // ====================== CONFIG ======================
      const YOUR_EMAIL = "seongchunlaw050@gmail.com";

      let globalCart = [];
      let globalTotalCount = 0;
      let globalSubtotalPrice = 0;

      // ====================== RENDER CART ======================
      function renderCart() {
        const container = document.getElementById("cart-items-container");
        const checkoutBtn = document.getElementById("checkout-btn");
        globalCart = JSON.parse(localStorage.getItem("cart")) || [];

        if (globalCart.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-12 rounded-3xl border border-neutral-100 shadow-sm text-center max-w-xl mx-auto my-6">
              <div class="w-20 h-20 bg-neutral-50 rounded-full flex items-center justify-center mx-auto mb-5">
                <i class="fa-solid fa-folder-open text-3xl text-neutral-300"></i>
              </div>
              <h3 class="text-xl font-bold text-neutral-800 mb-2">Your Bag is Empty</h3>
              <p class="text-neutral-400 text-sm max-w-sm mx-auto mb-8">Looks like you haven't added any products to your workspace showroom bag yet.</p>
              <a href="./index.html" class="inline-flex items-center gap-2 bg-neutral-950 hover:bg-neutral-800 text-white font-bold px-6 py-3.5 rounded-xl transition-all active:scale-95 text-sm shadow-sm">
                Explore Products <i class="fa-solid fa-arrow-right text-xs"></i>
              </a>
            </div>
          `;
          updateSummary(0, 0);
          checkoutBtn.disabled = true;
          return;
        }

        checkoutBtn.disabled = false;
        let htmlContent = "";
        globalTotalCount = 0;
        globalSubtotalPrice = 0;

        globalCart.forEach((item, index) => {
          let itemTotalCost = item.price * item.quantity;
          globalTotalCount += item.quantity;
          globalSubtotalPrice += itemTotalCost;

          htmlContent += `
            <div class="bg-white p-5 sm:p-6 rounded-3xl border border-neutral-100 shadow-sm flex flex-col sm:flex-row gap-5 items-start sm:items-center transition-all hover:border-neutral-200">
              <div class="w-24 h-24 sm:w-28 sm:h-28 bg-neutral-50 rounded-2xl overflow-hidden flex-shrink-0 border border-neutral-100">
                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
              </div>
              
              <div class="flex-1 w-full">
                <div class="flex justify-between items-start gap-4">
                  <div>
                    <h3 class="font-bold text-lg text-neutral-800 leading-snug">${item.name}</h3>
                    <p class="text-neutral-400 text-xs mt-1 font-medium flex items-center gap-1.5">
                      <span>Size: <strong class="text-neutral-700 font-semibold">${item.size}</strong></span>
                      <span class="text-neutral-200">•</span>
                      <span>Color: <strong class="text-neutral-700 font-semibold">${item.color}</strong></span>
                    </p>
                  </div>
                  <button onclick="removeItem(${index})" class="text-neutral-400 hover:text-rose-500 p-1.5 hover:bg-rose-50 rounded-xl transition-all active:scale-90 flex-shrink-0" title="Remove product">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                  </button>
                </div>
                
                <div class="flex items-center justify-between mt-5 pt-3 border-t border-neutral-50">
                  <div class="flex items-center bg-neutral-50 border border-neutral-200/60 rounded-xl p-1 shadow-inner">
                    <button onclick="updateQuantity(${index}, -1)" class="w-8 h-8 flex items-center justify-center font-bold hover:bg-white rounded-lg transition-colors text-neutral-500 active:scale-95 text-sm">-</button>
                    <span class="w-10 text-center font-bold text-neutral-800 text-sm">${item.quantity}</span>
                    <button onclick="updateQuantity(${index}, 1)" class="w-8 h-8 flex items-center justify-center font-bold hover:bg-white rounded-lg transition-colors text-neutral-500 active:scale-95 text-sm">+</button>
                  </div>
                  <p class="font-extrabold text-neutral-900 text-lg">RM${itemTotalCost.toFixed(2)}</p>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;
        updateSummary(globalTotalCount, globalSubtotalPrice);
      }

      function updateQuantity(index, modifier) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (!cart[index]) return;

        cart[index].quantity += modifier;
        if (cart[index].quantity < 1) cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function updateSummary(count, subtotal) {
        document.getElementById("subtotal-label").textContent =
          `Subtotal (${count} item${count !== 1 ? "s" : ""})`;
        document.getElementById("subtotal-price").textContent =
          `RM ${subtotal.toFixed(2)}`;
        document.getElementById("total-price").textContent =
          `RM ${subtotal.toFixed(2)}`;
      }

      // ====================== CHECKOUT ======================
      async function handleCheckout() {
        const form = document.getElementById("customer-form");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (globalCart.length === 0) return;

        const customer = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          postalCode: document.getElementById("postalCode").value.trim(),
          country: document.getElementById("country").value.trim(),
        };

        const checkoutBtn = document.getElementById("checkout-btn");
        checkoutBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Processing Order...`;
        checkoutBtn.disabled = true;

        // Build items breakdown
        let itemsBreakdownText = "";
        globalCart.forEach((item, i) => {
          itemsBreakdownText += `${i + 1}. ${item.name} (Size: ${item.size}, Color: ${item.color}) × ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}\n`;
        });

        const formData = {
          __Subject: `🛒 New Order from ${customer.fullName}`,
          "Customer Name": customer.fullName,
          Email: customer.email,
          Phone: customer.phone,
          "Shipping Address": `${customer.address}, ${customer.city} ${customer.postalCode}, ${customer.country}`,
          "Order Total Items": globalTotalCount,
          "Order Total Price": `RM${globalSubtotalPrice.toFixed(2)}`,
          "Items List Details": `\n${itemsBreakdownText}`,
          _template: "table",
        };

        try {
          const response = await fetch(
            `https://formsubmit.co/ajax/${YOUR_EMAIL}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(formData),
            },
          );

          if (response.ok) {
            alert("🎉 Order placed successfully! We will contact you soon.");
            localStorage.removeItem("cart");
            window.location.href = "index.html";
          } else {
            throw new Error("Failed to submit");
          }
        } catch (error) {
          console.error(error);
          alert(
            "❌ Something went wrong with the checkout process. Please try again.",
          );
        } finally {
          checkoutBtn.innerHTML = `COMPLETE ORDER`;
          checkoutBtn.disabled = false;
        }
      }

      // Initialize
      renderCart();
    </script>
  </body>
</html>
