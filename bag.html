<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Gimas Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-[#FAFAFA] text-zinc-900 min-h-screen flex flex-col antialiased"
  >
    <header
      class="bg-[#121212] border-b border-zinc-800 sticky top-0 z-50 py-4 transition-all duration-300"
    >
      <nav
        class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between items-center"
      >
        <a
          href="./index.html"
          class="flex items-center gap-3 group transition-transform active:scale-95"
        >
          <img
            src="images/white.png"
            class="h-9 w-auto object-contain transition-transform duration-300 group-hover:scale-102"
            alt="logo"
          />
        </a>
        <a
          href="./index.html"
          class="text-zinc-400 hover:text-white transition-colors font-bold text-[11px] tracking-[0.2em] flex items-center gap-2.5 group"
        >
          <i
            class="fa-solid fa-arrow-left text-[10px] transition-transform group-hover:-translate-x-1"
          ></i>
          CONTINUE SHOPPING
        </a>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12 md:py-16 flex-1 w-full">
      <div class="mb-10">
        <span
          class="text-[11px] font-bold tracking-[0.25em] text-zinc-400 uppercase block mb-1"
        >
          Review Selection
        </span>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-zinc-900">
          YOUR SHOPPING BAG
        </h1>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-start">
        <div id="cart-items-container" class="lg:col-span-7 space-y-5"></div>

        <div class="lg:col-span-5 space-y-6">
          <div
            class="bg-white p-6 sm:p-8 rounded-2xl border border-zinc-100 shadow-[0_10px_30px_rgba(0,0,0,0.01)]"
          >
            <h2
              class="text-xs font-bold uppercase tracking-[0.15em] text-zinc-400 mb-6 flex items-center gap-2.5"
            >
              <i class="fa-regular fa-address-card text-zinc-400 text-sm"></i>
              Delivery Information
            </h2>

            <form
              id="customer-form"
              action="https://formspree.io/f/xnjlnpoq"
              method="POST"
              onsubmit="handleCheckout(event)"
              class="space-y-4"
            >
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                  >
                    Full Name <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="fullName"
                    name="name"
                    required
                    placeholder="John Doe"
                    class="w-full px-4 h-12 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium bg-white"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                  >
                    Phone Number <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    placeholder="+60123456789"
                    class="w-full px-4 h-12 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium bg-white"
                  />
                </div>
              </div>

              <div>
                <label
                  class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                >
                  Email Address <span class="text-red-500">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="name@domain.com"
                  class="w-full px-4 h-12 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium bg-white"
                />
              </div>

              <div>
                <label
                  class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                >
                  Shipping Address <span class="text-red-500">*</span>
                </label>
                <textarea
                  id="address"
                  name="address"
                  rows="3"
                  required
                  placeholder="Street name, Unit/Apt number..."
                  class="w-full px-4 py-3 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium resize-none bg-white"
                ></textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                  >
                    City <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="city"
                    name="city"
                    required
                    placeholder="Kuala Lumpur"
                    class="w-full px-4 h-12 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium bg-white"
                  />
                </div>
                <div>
                  <label
                    class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                  >
                    Postal Code <span class="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    id="postalCode"
                    name="postalCode"
                    required
                    placeholder="50000"
                    class="w-full px-4 h-12 border border-zinc-200 rounded-xl focus:outline-none focus:border-zinc-950 text-xs font-medium bg-white"
                  />
                </div>
              </div>

              <div>
                <label
                  class="block text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-2"
                >
                  Country
                </label>
                <input
                  type="text"
                  id="country"
                  name="country"
                  value="Malaysia"
                  readonly
                  class="w-full px-4 h-12 border border-zinc-100 bg-zinc-50 font-semibold text-zinc-500 text-xs rounded-xl cursor-default focus:outline-none"
                />
              </div>

              <input
                type="hidden"
                name="Order Total"
                id="orderTotal"
                value=""
              />
              <input
                type="hidden"
                name="Total Items"
                id="totalItems"
                value=""
              />
              <input type="hidden" name="Items" id="itemsList" value="" />
              <input type="hidden" name="_subject" id="_subject" value="" />
            </form>
          </div>

          <div
            class="bg-white p-6 sm:p-8 rounded-2xl border border-zinc-100 shadow-[0_10px_30px_rgba(0,0,0,0.01)] sticky top-28"
          >
            <h2
              class="text-xs font-bold uppercase tracking-[0.15em] text-zinc-400 mb-6"
            >
              Order Summary
            </h2>
            <div class="space-y-4 text-xs">
              <div
                class="flex justify-between items-center text-zinc-500 font-medium"
              >
                <span id="subtotal-label">Subtotal (0 items)</span>
                <span id="subtotal-price" class="font-bold text-zinc-900"
                  >RM 0.00</span
                >
              </div>
              <div
                class="flex justify-between items-center text-zinc-500 font-medium"
              >
                <span>Shipping Fee</span>
                <span
                  id="shipping-price"
                  class="text-zinc-900 font-bold bg-zinc-100 px-2.5 py-1 rounded-lg text-[10px] tracking-wider"
                  >FREE</span
                >
              </div>
              <div class="h-px bg-zinc-100 my-2"></div>
              <div
                class="flex justify-between items-center text-xs font-bold text-zinc-900 pt-2"
              >
                <span class="uppercase tracking-wider text-[11px] text-zinc-500"
                  >Estimated Total</span
                >
                <span
                  id="total-price"
                  class="text-xl font-black text-zinc-950 tracking-tight"
                  >RM 0.00</span
                >
              </div>
            </div>

            <button
              type="submit"
              form="customer-form"
              id="checkout-btn"
              class="w-full mt-8 bg-zinc-950 text-white h-13 py-4 rounded-xl font-bold text-xs tracking-widest uppercase hover:bg-zinc-850 active:scale-[0.99] transition-all flex items-center justify-center gap-3 shadow-sm disabled:bg-zinc-100 disabled:text-zinc-300 disabled:cursor-not-allowed disabled:shadow-none"
            >
              COMPLETE ORDER
            </button>

            <p
              class="text-center text-[10px] font-bold tracking-wider uppercase text-zinc-400 mt-5 flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-lock text-[9px]"></i> Secure Checkout
            </p>
          </div>
        </div>
      </div>
    </main>

    <script>
      let globalCart = [];
      let globalTotalCount = 0;
      let globalSubtotalPrice = 0;

      // ====================== RENDER CART ======================
      function renderCart() {
        const container = document.getElementById("cart-items-container");
        const checkoutBtn = document.getElementById("checkout-btn");
        globalCart = JSON.parse(localStorage.getItem("cart")) || [];

        if (globalCart.length === 0) {
          container.innerHTML = `
      <div class="bg-white p-12 md:p-16 rounded-2xl border border-zinc-100 text-center w-full shadow-[0_10px_30px_rgba(0,0,0,0.01)]">
        <div class="w-16 h-16 bg-zinc-50 rounded-full flex items-center justify-center mx-auto mb-5 border border-zinc-100/60">
          <i class="fa-solid fa-basket-shopping text-xl text-zinc-300"></i>
        </div>
        <h3 class="text-lg font-bold text-zinc-900 mb-1.5 uppercase tracking-wide">Your Bag is Empty</h3>
        <p class="text-zinc-400 text-xs font-medium max-w-xs mx-auto mb-8">Looks like you haven't added any products to your selection yet.</p>
        <a href="./index.html" class="inline-flex items-center gap-2.5 bg-zinc-950 hover:bg-zinc-850 text-white font-bold px-6 py-3.5 rounded-xl text-xs tracking-wider uppercase transition-all active:scale-95 shadow-sm">
          Explore Products <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </a>
      </div>
    `;
          updateSummary(0, 0);
          checkoutBtn.disabled = true;
          return;
        }

        checkoutBtn.disabled = false;
        let htmlContent = "";
        globalTotalCount = 0;
        globalSubtotalPrice = 0;

        globalCart.forEach((item, index) => {
          let itemTotalCost = item.price * item.quantity;
          globalTotalCount += item.quantity;
          globalSubtotalPrice += itemTotalCost;

          // Conditional size display
          let sizeHTML = "";
          if (
            item.size &&
            item.size !== "undefined" &&
            item.size.trim() !== ""
          ) {
            sizeHTML = `
        <span>Size: <strong class="text-zinc-800 font-semibold">${item.size}</strong></span>
        <span class="text-zinc-200">•</span>
      `;
          }

          htmlContent += `
      <div class="bg-white p-5 rounded-2xl border border-zinc-100 shadow-[0_10px_30px_rgba(0,0,0,0.01)] flex flex-col sm:flex-row gap-5 items-start sm:items-center transition-all hover:border-zinc-200">
        <div class="w-24 h-24 bg-zinc-50 rounded-xl overflow-hidden flex-shrink-0 border border-zinc-100 p-1 flex items-center justify-center">
          <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover rounded-lg">
        </div>
        <div class="flex-1 w-full">
          <div class="flex justify-between items-start gap-4">
            <div>
              <h3 class="font-bold text-base text-zinc-900 uppercase tracking-tight leading-tight">${item.name}</h3>
              <p class="text-xs text-zinc-500 mt-1.5 font-medium flex items-center gap-2">
                ${sizeHTML}
                <span>Color: <strong class="text-zinc-800 font-semibold">${item.color || "N/A"}</strong></span>
              </p>
            </div>
            <button onclick="removeItem(${index})" class="text-zinc-400 hover:text-red-500 p-2 hover:bg-zinc-50 rounded-xl transition-all active:scale-90 flex-shrink-0">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
          <div class="flex justify-between items-center mt-6 pt-3 border-t border-zinc-50">
            <div class="flex border border-zinc-200 rounded-xl p-0.5 shadow-sm h-9 bg-zinc-50">
              <button onclick="updateQuantity(${index}, -1)" class="w-8 h-full flex items-center justify-center font-bold hover:bg-white rounded-lg transition-colors text-zinc-400 hover:text-zinc-900 active:scale-95 text-xs">-</button>
              <span class="w-8 text-center font-bold text-zinc-900 text-xs flex items-center justify-center">${item.quantity}</span>
              <button onclick="updateQuantity(${index}, 1)" class="w-8 h-full flex items-center justify-center font-bold hover:bg-white rounded-lg transition-colors text-zinc-400 hover:text-zinc-900 active:scale-95 text-xs">+</button>
            </div>
            <p class="font-bold text-zinc-900 text-base tracking-tight">RM ${itemTotalCost.toFixed(2)}</p>
          </div>
        </div>
      </div>
    `;
        });

        container.innerHTML = htmlContent;
        updateSummary(globalTotalCount, globalSubtotalPrice);
      }

      function updateQuantity(index, modifier) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (!cart[index]) return;
        cart[index].quantity += modifier;
        if (cart[index].quantity < 1) cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function updateSummary(count, subtotal) {
        document.getElementById("subtotal-label").textContent =
          `Subtotal (${count} item${count !== 1 ? "s" : ""})`;
        document.getElementById("subtotal-price").textContent =
          `RM ${subtotal.toFixed(2)}`;
        document.getElementById("total-price").textContent =
          `RM ${subtotal.toFixed(2)}`;
      }

      // ====================== CHECKOUT (AJAX FORMSPREE) ======================
      async function handleCheckout(event) {
        event.preventDefault(); // Halt default form action redirection

        const form = document.getElementById("customer-form");
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (globalCart.length === 0) {
          alert("Your cart is empty!");
          return;
        }

        const checkoutBtn = document.getElementById("checkout-btn");
        const originalText = checkoutBtn.innerHTML;
        checkoutBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Processing...`;
        checkoutBtn.disabled = true;

        // Build clean multi-line text format for email summary
        const itemsList = globalCart
          .map(
            (item, i) =>
              `${i + 1}. ${item.name} (Size: ${item.size}, Color: ${item.color}) × ${item.quantity} - RM ${(item.price * item.quantity).toFixed(2)}`,
          )
          .join("\n");

        // Sync local calculated fields into hidden parameters
        document.getElementById("orderTotal").value =
          `RM ${globalSubtotalPrice.toFixed(2)}`;
        document.getElementById("totalItems").value = globalTotalCount;
        document.getElementById("itemsList").value = itemsList;
        document.getElementById("_subject").value =
          `New Order from ${document.getElementById("fullName").value.trim()}`;

        try {
          const response = await fetch(form.action, {
            method: form.method,
            body: new FormData(form),
            headers: {
              Accept: "application/json",
            },
          });

          if (response.ok) {
            // Clear storage right away upon form success verification
            localStorage.removeItem("cart");

            // Structural screen shift to minimal completion display block
            document.querySelector("main").innerHTML = `
              <div class="max-w-md mx-auto bg-white p-8 md:p-12 rounded-2xl border border-zinc-100 text-center my-12 shadow-[0_10px_30px_rgba(0,0,0,0.01)] animate-fade-in">
                <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6">
                  <i class="fa-solid fa-circle-check text-2xl text-emerald-500"></i>
                </div>
                <h3 class="text-xl font-bold text-zinc-900 mb-2 uppercase tracking-wide">Order Placed Successfully!</h3>
                <p class="text-zinc-500 text-xs mb-8 leading-relaxed font-medium">
                  Thank you for your order. We have received your structural delivery records and will arrange fulfillment instructions shortly.
                </p>
                <a href="./index.html" class="inline-flex w-full justify-center items-center gap-2.5 bg-zinc-950 text-white font-bold h-12 rounded-xl text-xs tracking-widest uppercase hover:bg-zinc-800 transition-all shadow-sm active:scale-98">
                  Continue Shopping
                </a>
              </div>
            `;
          } else {
            alert(
              "Oops! There was a problem submitting your form. Please try again.",
            );
            checkoutBtn.innerHTML = originalText;
            checkoutBtn.disabled = false;
          }
        } catch (error) {
          alert(
            "Network error. Please check your internet connection and try again.",
          );
          checkoutBtn.innerHTML = originalText;
          checkoutBtn.disabled = false;
        }
      }

      // Initialize Layout on Load
      renderCart();
    </script>
  </body>
</html>
