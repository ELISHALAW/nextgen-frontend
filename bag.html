<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Gimas Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen">
    <!-- Header -->
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-50 py-5">
      <nav class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <a href="./index.html" class="flex items-center gap-3">
          <img
            src="images/white.png"
            class="h-10 w-auto object-contain"
            alt="logo"
          />
        </a>
        <a
          href="./index.html"
          class="text-white hover:text-amber-500 transition-colors font-semibold text-sm tracking-widest flex items-center gap-2"
        >
          <i class="fa-solid fa-arrow-left"></i> CONTINUE SHOPPING
        </a>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
      <h1 class="text-4xl font-extrabold mb-10 flex items-center gap-4">
        <i class="fa-solid fa-bag-shopping text-amber-500"></i>
        Your Shopping Bag
      </h1>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
        <!-- Cart Items -->
        <div id="cart-items-container" class="lg:col-span-2 space-y-8">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Right Column: Customer Info + Order Summary -->
        <div class="lg:col-span-1 space-y-8">
          <!-- Customer Information Form -->
          <div class="bg-white p-8 rounded-3xl shadow-sm">
            <h2 class="text-2xl font-bold mb-6">Contact & Shipping Info</h2>

            <form id="customer-form" class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium text-gray-600 mb-2"
                    >Full Name <span class="text-red-500">*</span></label
                  >
                  <input
                    type="text"
                    id="fullName"
                    required
                    class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-600 mb-2"
                    >Phone Number <span class="text-red-500">*</span></label
                  >
                  <input
                    type="tel"
                    id="phone"
                    required
                    class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                  />
                </div>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-600 mb-2"
                  >Email Address <span class="text-red-500">*</span></label
                >
                <input
                  type="email"
                  id="email"
                  required
                  class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-600 mb-2"
                  >Shipping Address <span class="text-red-500">*</span></label
                >
                <textarea
                  id="address"
                  rows="3"
                  required
                  class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black resize-y transition-colors"
                ></textarea>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                  <label class="block text-sm font-medium text-gray-600 mb-2"
                    >City <span class="text-red-500">*</span></label
                  >
                  <input
                    type="text"
                    id="city"
                    required
                    class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-600 mb-2"
                    >Postal Code <span class="text-red-500">*</span></label
                  >
                  <input
                    type="text"
                    id="postalCode"
                    required
                    class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-600 mb-2"
                    >Country</label
                  >
                  <input
                    type="text"
                    id="country"
                    value="Malaysia"
                    class="w-full px-5 py-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-black transition-colors"
                  />
                </div>
              </div>
            </form>
          </div>

          <!-- Order Summary -->
          <div class="bg-white p-8 rounded-3xl shadow-sm sticky top-8">
            <h2 class="text-2xl font-semibold mb-6">Order Summary</h2>

            <div class="space-y-4 text-lg">
              <div class="flex justify-between">
                <span id="subtotal-label" class="text-gray-600"
                  >Subtotal (0 items)</span
                >
                <span id="subtotal-price" class="font-medium">$0.00</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">Shipping</span>
                <span id="shipping-price" class="text-green-600 font-medium"
                  >FREE</span
                >
              </div>
              <div class="h-px bg-gray-200 my-4"></div>
              <div class="flex justify-between text-xl font-bold">
                <span>Total</span>
                <span id="total-price" class="font-bold">$0.00</span>
              </div>
            </div>

            <button
              onclick="handleCheckout()"
              id="checkout-btn"
              class="w-full mt-8 bg-black text-white py-4 rounded-2xl font-semibold text-lg hover:bg-gray-800 transition-all flex items-center justify-center gap-2"
            >
              COMPLETE ORDER
            </button>

            <p class="text-center text-sm text-gray-500 mt-6">
              Taxes calculated at checkout
            </p>
          </div>
        </div>
      </div>
    </main>

    <script>
      // ====================== CONFIG ======================
      const YOUR_EMAIL = "seongchunlaw050@gmail.com";

      let globalCart = [];
      let globalTotalCount = 0;
      let globalSubtotalPrice = 0;

      // ====================== RENDER CART ======================
      function renderCart() {
        const container = document.getElementById("cart-items-container");
        globalCart = JSON.parse(localStorage.getItem("cart")) || [];

        if (globalCart.length === 0) {
          container.innerHTML = `
                    <div class="bg-white p-12 rounded-2xl shadow-sm text-center">
                        <i class="fa-solid fa-folder-open text-5xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-xl font-medium">Your bag is currently empty.</p>
                        <a href="./show.html" class="inline-block mt-6 bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl transition-colors">Shop Products</a>
                    </div>
                `;
          updateSummary(0, 0);
          return;
        }

        let htmlContent = "";
        globalTotalCount = 0;
        globalSubtotalPrice = 0;

        globalCart.forEach((item, index) => {
          let itemTotalCost = item.price * item.quantity;
          globalTotalCount += item.quantity;
          globalSubtotalPrice += itemTotalCost;

          htmlContent += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm flex gap-6">
                        <div class="w-32 h-32 bg-gray-100 rounded-xl overflow-hidden flex-shrink-0">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between">
                                <h3 class="font-semibold text-lg">${item.name}</h3>
                                <button onclick="removeItem(${index})" class="text-gray-400 hover:text-red-500 transition-colors">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <p class="text-gray-500 text-sm">Size: ${item.size} • Color: ${item.color}</p>
                            <div class="flex items-center justify-between mt-4">
                                <div class="flex items-center border border-gray-200 rounded-xl">
                                    <button onclick="updateQuantity(${index}, -1)" class="px-4 py-2 hover:bg-gray-100 rounded-l-xl">-</button>
                                    <span class="px-4 py-2 font-medium">${item.quantity}</span>
                                    <button onclick="updateQuantity(${index}, 1)" class="px-4 py-2 hover:bg-gray-100 rounded-r-xl">+</button>
                                </div>
                                <p class="font-semibold">$${(item.price * item.quantity).toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                `;
        });

        container.innerHTML = htmlContent;
        updateSummary(globalTotalCount, globalSubtotalPrice);
      }

      function updateQuantity(index, modifier) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (!cart[index]) return;

        cart[index].quantity += modifier;
        if (cart[index].quantity < 1) cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function updateSummary(count, subtotal) {
        document.getElementById("subtotal-label").textContent =
          `Subtotal (${count} item${count !== 1 ? "s" : ""})`;
        document.getElementById("subtotal-price").textContent =
          `$${subtotal.toFixed(2)}`;
        document.getElementById("total-price").textContent =
          `$${subtotal.toFixed(2)}`;
      }

      // ====================== CHECKOUT ======================
      async function handleCheckout() {
        const form = document.getElementById("customer-form");

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (globalCart.length === 0) return;

        const customer = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          postalCode: document.getElementById("postalCode").value.trim(),
          country: document.getElementById("country").value.trim(),
        };

        const checkoutBtn = document.getElementById("checkout-btn");
        checkoutBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Processing...`;
        checkoutBtn.disabled = true;

        // Build items breakdown
        let itemsBreakdownText = "";
        globalCart.forEach((item, i) => {
          itemsBreakdownText += `${i + 1}. ${item.name} (Size: ${item.size}, Color: ${item.color}) × ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}\n`;
        });

        const formData = {
          __Subject: `🛒 New Order from ${customer.fullName}`,
          "Customer Name": customer.fullName,
          Email: customer.email,
          Phone: customer.phone,
          "Shipping Address": `${customer.address}, ${customer.city} ${customer.postalCode}, ${customer.country}`,
          "Order Total Items": globalTotalCount,
          "Order Total Price": `$${globalSubtotalPrice.toFixed(2)}`,
          "Items List Details": `\n${itemsBreakdownText}`,
          _template: "table",
        };

        try {
          const response = await fetch(
            `https://formsubmit.co/ajax/${YOUR_EMAIL}`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(formData),
            },
          );

          if (response.ok) {
            alert("🎉 Order placed successfully! We will contact you soon.");
            localStorage.removeItem("cart");
            window.location.href = "index.html";
          } else {
            throw new Error("Failed to submit");
          }
        } catch (error) {
          console.error(error);
          alert("❌ Something went wrong. Please try again.");
        } finally {
          checkoutBtn.innerHTML = `COMPLETE ORDER`;
          checkoutBtn.disabled = false;
        }
      }

      // Initialize
      renderCart();
    </script>
  </body>
</html>
