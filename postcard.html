<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion | Gimas Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #fafafa;
      }

      .product-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .product-card:hover {
        transform: translateY(-12px);
        box-shadow: 0 30px 70px -20px rgb(0 0 0 / 0.12);
      }

      .product-image {
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .product-card:hover .product-image {
        transform: scale(1.06);
      }
    </style>
  </head>
  <body class="min-h-screen antialiased flex flex-col">
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-40 py-4 md:py-5">
      <nav
        class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center"
      >
        <a href="./index.html">
          <img src="images/white.png" class="h-9 md:h-10 w-auto" alt="logo" />
        </a>
        <div class="flex items-center gap-8">
          <a
            href="./index.html"
            class="text-white hover:text-amber-500 transition-colors font-bold text-xs tracking-[0.2em]"
          >
            BACK TO HOME
          </a>
          <a
            href="bag.html"
            class="relative text-white hover:text-amber-500 transition-colors"
          >
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span
              id="bag-count"
              class="absolute -top-2 -right-2 bg-amber-500 text-white text-[9px] font-bold px-1.5 rounded-full hidden"
              >0</span
            >
          </a>
        </div>
      </nav>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 py-12 md:py-20 w-full">
      <div class="mb-16 text-center">
        <h1
          class="text-6xl md:text-7xl font-extrabold text-slate-900 tracking-tighter"
        >
          Postcard
        </h1>
        <p class="text-slate-500 mt-4 text-xl max-w-md mx-auto">
          Curated premium essentials for your wardrobe.
        </p>
      </div>

      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-8 gap-y-16"
      >
        <div
          class="product-card group flex flex-col bg-white rounded-3xl overflow-hidden"
        >
          <div class="relative aspect-[4/5] overflow-hidden bg-slate-100">
            <img
              src="images/postcard6.png"
              class="product-image w-full h-full object-cover"
              alt="Postcard"
            />
            <div
              class="absolute top-5 left-5 bg-white text-xs font-bold px-4 py-2 rounded-2xl shadow"
            >
              NEW
            </div>
          </div>
          <div class="p-8">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="text-2xl font-bold text-slate-900">
                  Shirring Volume
                </h3>
                <p class="text-slate-500 mt-1">Gingham Sleeve</p>
              </div>
              <p class="text-2xl font-extrabold text-slate-900">RM 9.90</p>
            </div>

            <a
              href="postcardDetail.html"
              class="mt-8 w-full py-4 bg-slate-900 text-white rounded-2xl font-semibold hover:bg-amber-500 transition-all flex items-center justify-center gap-3"
            >
              <i class="fa-solid fa-bag-shopping"></i>
              <span>Add to Bag</span>
            </a>
          </div>
        </div>
      </div>
    </main>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      window.onload = syncBagBadgeCount;

      function syncBagBadgeCount() {
        const count = cart.reduce((acc, item) => acc + item.quantity, 0);
        const badge = document.getElementById("bag-count");
        badge.textContent = count;
        badge.classList.toggle("hidden", count === 0);
      }

      function addToCart(event) {
        const btn = event.currentTarget;
        const card = btn.closest(".product-card");
        const name = card.querySelector("h3").textContent.trim();
        const price = parseFloat(
          card
            .querySelector(".font-extrabold")
            .textContent.replace("RM", "")
            .trim(),
        );

        // Grab values from select elements
        let size = card.querySelectorAll("select")[0].value;
        let color = card.querySelectorAll("select")[1].value;
        const quantity = 1;

        // Bypassing validation alert requirements: assign defaults if left empty
        if (!size) size = "Default Size";
        if (!color) color = "Default Color";

        const cartId = `${name}-${size}-${color}`;
        const existing = cart.find((item) => item.cartId === cartId);

        if (existing) {
          existing.quantity += quantity;
        } else {
          cart.push({
            cartId,
            name,
            size,
            color,
            price,
            quantity,
            image: card.querySelector("img").src,
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        syncBagBadgeCount();

        // Immediate visual confirmation feedback
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Added!`;
        btn.style.backgroundColor = "#10b981";

        // Swift redirection to fashionDetail.html without any verification stops
        setTimeout(() => {
          window.location.href = "fashionDetail.html";
        }, 400);
      }
    </script>
  </body>
</html>
