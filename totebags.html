<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Shirts | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .product-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .product-card:hover {
        transform: translateY(-8px);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
    </style>
  </head>
  <body
    class="bg-[#F8FAFC] text-slate-900 min-h-screen flex flex-col antialiased"
  >
    <header
      class="bg-[#252525] border-b border-neutral-800 sticky top-0 z-50 py-3.5"
    >
      <nav class="max-w-6xl mx-auto px-6 flex justify-between items-center">
        <a href="./index.html" class="flex items-center gap-3"
          ><img src="images/white.png" class="h-10 w-auto" alt="Logo"
        /></a>
        <button
          onclick="toggleCart()"
          class="relative flex items-center justify-center h-11 w-11 rounded-xl bg-neutral-800 text-white border border-neutral-700"
        >
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span
            id="bag-count"
            class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-[#252525] hidden"
            >0</span
          >
        </button>
      </nav>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-6 py-12">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">T-Shirts</h1>
          <p class="text-slate-500 mt-1">Premium collection for women</p>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        <div
          class="product-card group bg-white rounded-2xl overflow-hidden border border-slate-100"
        >
          <img
            src="images/touchpad.jpeg"
            class="w-full aspect-[4/5] object-cover"
            alt="T-Shirt"
          />
          <div class="p-4">
            <p class="text-xs text-slate-500">Women • S-XL</p>
            <p class="font-semibold text-sm mb-3">
              Shirring Volume Sleeve • Gingham
            </p>
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg">RM 99.90</span>
              <button
                onclick="addToCart(this)"
                class="p-2 text-slate-400 hover:text-slate-900"
              >
                <i class="fa-solid fa-bag-shopping"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          class="product-card group bg-white rounded-2xl overflow-hidden border border-slate-100"
        >
          <img
            src="images/touchpad1.png"
            class="w-full aspect-[4/5] object-cover"
            alt="T-Shirt"
          />
          <div class="p-4">
            <p class="text-xs text-slate-500">Women • S-XL</p>
            <p class="font-semibold text-sm mb-3">
              Shirring Volume Sleeve • White
            </p>
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg">RM 99.90</span>
              <button
                onclick="addToCart(this)"
                class="p-2 text-slate-400 hover:text-slate-900"
              >
                <i class="fa-solid fa-bag-shopping"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          class="product-card group bg-white rounded-2xl overflow-hidden border border-slate-100"
        >
          <img
            src="images/touchpad2.jpeg"
            class="w-full aspect-[4/5] object-cover"
            alt="T-Shirt"
          />
          <div class="p-4">
            <p class="text-xs text-slate-500">Women • XS-XXL</p>
            <p class="font-semibold text-sm mb-3">
              Waffle Full Open Mini • Print
            </p>
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg">RM 49.90</span>
              <button
                onclick="addToCart(this)"
                class="p-2 text-slate-400 hover:text-slate-900"
              >
                <i class="fa-solid fa-bag-shopping"></i>
              </button>
            </div>
          </div>
        </div>

        <div
          class="product-card group bg-white rounded-2xl overflow-hidden border border-slate-100"
        >
          <img
            src="images/touchpad3.jpeg"
            class="w-full aspect-[4/5] object-cover"
            alt="T-Shirt"
          />
          <div class="p-4">
            <p class="text-xs text-slate-500">Women • XS-3XL</p>
            <p class="font-semibold text-sm mb-3">
              Crew Neck • Short Sleeve • Sage
            </p>
            <div class="flex justify-between items-center">
              <span class="font-bold text-lg text-rose-600">RM 39.90</span>
              <button
                onclick="addToCart(this)"
                class="p-2 text-slate-400 hover:text-slate-900"
              >
                <i class="fa-solid fa-bag-shopping"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      function syncBagBadgeCount() {
        const count = cart.reduce((acc, item) => acc + item.quantity, 0);
        const badge = document.getElementById("bag-count");
        badge.textContent = count;
        badge.classList.toggle("hidden", count === 0);
      }
      function addToCart(btn) {
        const card = btn.closest(".product-card");
        const name = card.querySelector("p.font-semibold").textContent.trim();
        const price = parseFloat(
          card
            .querySelector(".font-bold.text-lg")
            .textContent.replace("RM", "")
            .trim(),
        );
        const existing = cart.find((item) => item.name === name);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({
            id: Date.now(),
            name,
            price,
            quantity: 1,
            image: card.querySelector("img").src,
          });
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        syncBagBadgeCount();
      }
      // ... include existing toggleCart and removeFromCart functions here
    </script>
  </body>
</html>
