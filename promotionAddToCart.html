<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promo Offer | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .option-btn {
        transition: all 0.2s ease;
      }
      .option-btn.active {
        background-color: #ef4444;
        color: white;
        border-color: #ef4444;
        font-weight: 800;
      }
      .product-image-container {
        aspect-ratio: 4 / 4.5;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 text-gray-900 min-h-screen flex flex-col antialiased"
  >
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-50 py-4">
      <nav class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <a href="./index.html" class="flex items-center gap-3 group">
          <img
            id="nav-logo"
            src="images/white.png"
            class="h-14 w-auto object-contain transition-transform duration-500 group-hover:scale-105"
            alt="logo"
          />
        </a>
        <button
          onclick="toggleCart()"
          class="relative flex items-center gap-2 text-white hover:text-red-500 transition-colors"
        >
          <i class="fa-solid fa-bag-shopping text-2xl"></i>
          <span
            id="bag-count"
            class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#1A1A1A] hidden"
            >0</span
          >
        </button>
      </nav>
    </header>

    <main class="flex-1 w-full px-4 md:px-6 py-8">
      <div class="max-w-6xl mx-auto">
        <div
          class="bg-white rounded-3xl shadow-xl border-4 border-red-50 overflow-hidden"
        >
          <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
            <div class="lg:w-[500px] flex-shrink-0 relative">
              <div
                class="absolute top-6 left-6 z-10 bg-red-600 text-white px-5 py-2 rounded-full font-black text-sm tracking-widest shadow-lg -rotate-2"
              >
                -50% OFF
              </div>
              <div
                class="product-image-container w-full bg-gray-50 overflow-hidden"
              >
                <img
                  src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600"
                  class="w-full h-full object-cover"
                  alt="Heavyweight Tee"
                />
              </div>
            </div>

            <div
              class="flex-1 px-6 pb-10 lg:p-10 lg:pl-0 flex flex-col justify-center"
            >
              <h4
                class="font-black text-4xl lg:text-5xl tracking-tight leading-none uppercase"
              >
                HEAVYWEIGHT TEE
              </h4>
              <div class="mt-4 flex items-end gap-4">
                <p class="font-black text-5xl text-gray-900">$35.00</p>
                <p class="font-bold text-3xl text-gray-400 line-through">
                  $70.00
                </p>
              </div>

              <div class="mt-8">
                <p
                  class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3"
                >
                  Select Size
                </p>
                <div class="flex gap-3">
                  <button
                    onclick="selectSize(this)"
                    class="option-btn w-16 py-3.5 border-2 border-gray-200 bg-white rounded-2xl font-bold hover:border-gray-400 transition-all"
                  >
                    S
                  </button>
                  <button
                    onclick="selectSize(this)"
                    class="option-btn active w-16 py-3.5 border-2 border-gray-200 bg-white rounded-2xl font-bold hover:border-gray-400 transition-all"
                  >
                    M
                  </button>
                  <button
                    onclick="selectSize(this)"
                    class="option-btn w-16 py-3.5 border-2 border-gray-200 bg-white rounded-2xl font-bold hover:border-gray-400 transition-all"
                  >
                    L
                  </button>
                </div>
              </div>

              <button
                onclick="addToCart()"
                class="mt-8 w-full bg-red-600 hover:bg-red-700 text-white font-black text-lg py-5 rounded-2xl transition-all active:scale-[0.99] shadow-md shadow-red-600/10"
              >
                CLAIM DEAL & ADD TO BAG
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      id="cart-modal"
      class="hidden fixed inset-0 bg-black/70 z-[100] flex items-end lg:items-center justify-center p-0 lg:p-4"
    >
      <form
        action="https://api.web3forms.com/submit"
        method="POST"
        id="checkout-form"
        class="bg-white w-full max-w-lg lg:rounded-3xl rounded-t-3xl max-h-[92vh] lg:max-h-[88vh] flex flex-col shadow-2xl overflow-hidden"
      >
        <div
          class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10"
        >
          <h2 class="text-2xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-bag-shopping text-red-500"></i> Your Bag
          </h2>
          <button
            type="button"
            onclick="toggleCart()"
            class="text-3xl text-gray-400 hover:text-gray-600 transition-colors"
          >
            &times;
          </button>
        </div>

        <div class="flex-1 p-6 overflow-y-auto space-y-8 bg-white">
          <div>
            <p
              class="text-[11px] font-extrabold text-gray-400 uppercase tracking-widest mb-3"
            >
              Items Summary
            </p>
            <div id="cart-items" class="divide-y divide-gray-100"></div>
          </div>

          <div class="border-t pt-6 space-y-4">
            <p
              class="text-[11px] font-extrabold text-gray-400 uppercase tracking-widest mb-2"
            >
              Delivery Information
            </p>

            <input
              type="hidden"
              name="access_key"
              value="674464f9-68b4-447e-908d-8e3f58cb2ee6"
            />
            <input type="hidden" name="subject" value="New Order Received!" />
            <input type="hidden" name="from_name" value="Fashion Store" />
            <textarea
              name="order_details"
              id="order_details_field"
              class="hidden"
            ></textarea>

            <div>
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                >Full Name *</label
              >
              <input
                type="text"
                name="customer_name"
                required
                placeholder="John Doe"
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm transition-all"
              />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                  >Email Address *</label
                >
                <input
                  type="email"
                  name="customer_email"
                  required
                  placeholder="john@example.com"
                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm transition-all"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                  >Phone Number *</label
                >
                <input
                  type="tel"
                  name="customer_phone"
                  required
                  placeholder="+60123456789"
                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm transition-all"
                />
              </div>
            </div>

            <div>
              <label
                class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                >Shipping Address *</label
              >
              <textarea
                name="customer_address"
                rows="2"
                required
                placeholder="Unit, Building, Street details..."
                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm resize-none transition-all"
              ></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                  >City *</label
                >
                <input
                  type="text"
                  name="customer_city"
                  required
                  placeholder="Kuala Lumpur"
                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm transition-all"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold uppercase text-gray-500 mb-1.5"
                  >Postal Code *</label
                >
                <input
                  type="text"
                  name="customer_postal_code"
                  required
                  placeholder="50000"
                  class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm transition-all"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="p-6 border-t bg-gray-50 sticky bottom-0 z-10">
          <div class="flex justify-between items-center text-lg mb-4">
            <span class="font-semibold text-gray-600">Total Bill</span>
            <span id="cart-total" class="font-black text-2xl text-gray-900"
              >$0.00</span
            >
          </div>
          <button
            type="submit"
            id="checkout-submit-btn"
            class="w-full bg-black hover:bg-neutral-800 text-white py-4 rounded-2xl font-bold text-lg transition-all active:scale-[0.99] shadow-md flex items-center justify-center gap-2"
          >
            PROCEED TO CHECKOUT
          </button>
        </div>
      </form>
    </div>

    <script>
      let currentSize = "M";
      let cart = [];

      function selectSize(btn) {
        document
          .querySelectorAll(".option-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentSize = btn.textContent.trim();
      }

      function addToCart() {
        cart.push({ name: "Heavyweight Tee", price: 35, size: currentSize });
        updateCartUI();
        alert("Added to bag!");
      }

      function removeFromCart(index) {
        // Remove item from state array cleanly
        cart.splice(index, 1);
        updateCartUI();
      }

      function updateCartUI() {
        // Handle badge configuration count parameters
        const bagCount = document.getElementById("bag-count");
        bagCount.textContent = cart.length;
        if (cart.length > 0) {
          bagCount.classList.remove("hidden");
        } else {
          bagCount.classList.add("hidden");
        }

        const container = document.getElementById("cart-items");
        container.innerHTML = "";
        let total = 0;
        let orderSummary = "";

        // Build product list rows with inline individual removal interactions
        cart.forEach((item, index) => {
          total += item.price;
          orderSummary += `${index + 1}. ${item.name} (Size: ${item.size}) - $${item.price}.00\n`;

          container.innerHTML += `
            <div class="flex justify-between items-center py-3.5 first:pt-0 last:pb-0">
              <div>
                <p class="font-bold text-sm text-gray-800">${item.name}</p>
                <p class="text-xs text-gray-400 font-semibold mt-0.5">Size: ${item.size}</p>
              </div>
              <div class="flex items-center gap-4">
                <p class="font-extrabold text-sm text-gray-900">$${item.price}.00</p>
                <button 
                  type="button" 
                  onclick="removeFromCart(${index})" 
                  class="text-gray-300 hover:text-red-500 p-1.5 transition-colors group flex items-center justify-center"
                  title="Remove item"
                >
                  <i class="fa-solid fa-trash-can text-sm pointer-events-none"></i>
                </button>
              </div>
            </div>
          `;
        });

        // Save totals structural values to hidden form field endpoints
        document.getElementById("cart-total").textContent = `$${total}.00`;
        document.getElementById("order_details_field").value =
          `Items Breakdown:\n${orderSummary}\nTotal Final Billing Price Amount: $${total}.00`;

        // Manage click activity configuration parameters based on cart size lengths
        const submitBtn = document.getElementById("checkout-submit-btn");
        if (cart.length === 0) {
          container.innerHTML = `<p class="text-gray-400 text-sm text-center py-6">Your shopping bag is completely empty.</p>`;
          submitBtn.disabled = true;
          submitBtn.classList.add("opacity-50", "cursor-not-allowed");
        } else {
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      }

      function toggleCart() {
        document.getElementById("cart-modal").classList.toggle("hidden");
      }

      // Initialize runtime default views on application mount
      updateCartUI();
    </script>
  </body>
</html>
