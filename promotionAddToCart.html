<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Offer | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .option-btn { transition: all 0.2s ease; }
        .option-btn.active {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }
        .product-image-container { aspect-ratio: 4 / 4.5; }
        @keyframes subtlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-slow { animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

    <div class="bg-red-600 text-white text-center py-2 px-4 text-sm font-bold tracking-widest uppercase animate-pulse-slow">
        🔥 Flash Sale: 50% Off Selected T-Shirts & Apparel - Limited Time Only!
    </div>

    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-40 py-4 md:py-5">
        <nav class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center">
            <a href="#" class="flex items-center gap-3">
                <span class="text-white font-extrabold text-xl tracking-wider">NEXTGEN STUDIO</span>
            </a>
            <div class="flex items-center gap-6 md:gap-8">
                <a href="#" class="text-gray-300 hover:text-white transition-colors font-semibold text-sm tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left text-xs"></i> 
                    <span class="hidden sm:inline">BACK</span>
                </a>
                <a href="#" class="relative flex items-center gap-2 text-white hover:text-red-500 transition-colors font-medium group">
                    <i class="fa-solid fa-bag-shopping text-2xl"></i>
                    <span class="hidden md:inline">Bag</span>
                    <span id="bag-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#1A1A1A] hidden">0</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-1 w-full px-4 md:px-6 py-8">
        <div class="max-w-6xl mx-auto">
            <div class="bg-white rounded-3xl shadow-xl border-4 border-red-50 overflow-hidden relative">
                <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
                    
                    <div class="lg:w-[500px] flex-shrink-0 relative">
                        <div class="absolute top-6 left-6 z-10 bg-red-600 text-white px-5 py-2 rounded-full font-black text-sm md:text-base tracking-widest shadow-lg transform -rotate-2">
                            -50% OFF
                        </div>
                        <div class="product-image-container w-full bg-gray-50 overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?q=80&w=600" alt="Premium T-Shirt" class="w-full h-full object-cover object-center">
                        </div>
                    </div>
                    
                    <div class="flex-1 px-6 pb-10 lg:p-10 lg:pl-0 flex flex-col justify-center">
                        <div class="mb-6 inline-flex items-center gap-3 bg-red-50 border border-red-100 px-4 py-2 rounded-lg text-red-600 font-bold text-sm w-max">
                            <i class="fa-solid fa-clock animate-pulse"></i>
                            Offer ends in: <span id="countdown" class="font-black font-mono text-base">02:15:30</span>
                        </div>

                        <div class="flex flex-col gap-2">
                            <h3 class="font-extrabold text-2xl md:text-3xl uppercase tracking-tighter text-red-600">PREMIUM</h3>
                            <h4 class="font-black text-4xl md:text-5xl lg:text-6xl uppercase tracking-tight text-gray-900 leading-none">HEAVYWEIGHT TEE</h4>
                        </div>
                        
                        <div class="mt-4 flex items-end gap-4">
                            <p class="font-black text-5xl md:text-6xl text-gray-900">$35.00</p>
                            <p class="font-bold text-2xl md:text-3xl text-gray-400 line-through mb-1">$70.00</p>
                        </div>

                        <div class="mt-8">
                            <p class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Select Size</p>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="selectSize(this)" class="option-btn px-6 py-3 border-2 border-gray-200 rounded-xl text-base font-bold min-w-[60px]">S</button>
                                <button onclick="selectSize(this)" class="option-btn active px-6 py-3 border-2 border-gray-200 rounded-xl text-base font-bold min-w-[60px]">M</button>
                                <button onclick="selectSize(this)" class="option-btn px-6 py-3 border-2 border-gray-200 rounded-xl text-base font-bold min-w-[60px]">L</button>
                            </div>
                        </div>

                        <p id="selection" class="text-gray-500 mt-6 text-sm font-medium bg-gray-50 p-3 rounded-lg border border-gray-100">
                            Selected: Size <span class="text-gray-900 font-bold">M</span>
                        </p>

                        <button onclick="addToCart()" class="mt-8 w-full bg-red-600 hover:bg-red-700 text-white font-black text-lg py-5 rounded-2xl transition-all active:scale-[0.97] flex items-center justify-center gap-3 shadow-[0_8px_20px_rgba(220,38,38,0.3)]">
                            <i class="fa-solid fa-bolt"></i> CLAIM DEAL & ADD TO BAG
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentSize = 'M';
        let cartCount = 0;

        function selectSize(btn) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSize = btn.textContent;
            document.getElementById('selection').innerHTML = `Selected: Size <span class="text-gray-900 font-bold">${currentSize}</span>`;
        }

        function addToCart() {
            cartCount++;
            const badge = document.getElementById("bag-count");
            badge.textContent = cartCount;
            badge.classList.remove("hidden");
            
            const btn = document.querySelector('button[onclick="addToCart()"]');
            btn.innerHTML = `<i class="fa-solid fa-check"></i> ADDED TO BAG!`;
            setTimeout(() => { btn.innerHTML = `<i class="fa-solid fa-bolt"></i> CLAIM DEAL & ADD TO BAG`; }, 2000);
        }

        function startTimer(duration) {
            let timer = duration;
            const display = document.getElementById('countdown');
            setInterval(() => {
                let h = Math.floor(timer / 3600), m = Math.floor((timer % 3600) / 60), s = timer % 60;
                display.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (--timer < 0) timer = 0;
            }, 1000);
        }
        startTimer(8130);
    </script>
</body>
</html>
