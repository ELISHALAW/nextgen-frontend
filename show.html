<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/white.png">
    <title>Product Showcase | NextGen Boutique</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', system_ui, sans-serif; 
        }
        
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
        }

        .image-container {
            position: relative;
            overflow: hidden;
        }
        
        .image-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .product-card:hover .image-container::after {
            opacity: 1;
        }

        .price-tag {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.05em;
        }

        .sketch-border {
            border: 3px solid #1f2937;
            border-radius: 1.5rem;
            position: relative;
        }
        
        .sketch-border::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 3px solid #eab308;
            border-radius: 1.75rem;
            opacity: 0.15;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- NAV -->
    <nav class="bg-black border-b border-zinc-800 py-5 px-8 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-x-3">
            <div class="w-8 h-8 bg-yellow-400 rounded-2xl flex items-center justify-center text-black font-black text-2xl leading-none pt-0.5">G</div>
            <div>
                <span class="title-font font-bold tracking-tighter text-3xl">NEXTGEN</span>
            </div>
        </div>
        
        <div class="flex items-center gap-x-8 text-sm font-medium">
            <a href="#" class="hover:text-yellow-400 transition-colors flex items-center gap-x-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="uppercase tracking-widest text-xs">Back to Shop</span>
            </a>
            <a href="#" class="flex items-center gap-x-2 hover:text-yellow-400 transition-colors">
                <i class="fa-solid fa-bag-shopping text-xl"></i>
                <span class="font-semibold">Bag <span class="text-yellow-400">(2)</span></span>
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-16">
        <!-- HEADER -->
        <div class="mb-16 text-center">
            <div class="inline-flex items-center gap-x-2 bg-zinc-900 text-yellow-400 text-xs font-bold uppercase tracking-[0.125em] px-6 py-3 rounded-3xl border border-yellow-900 mb-6">
                <i class="fa-solid fa-sparkles"></i>
                MANAGED PRODUCTS
            </div>
            <h1 class="title-font text-7xl md:text-8xl font-bold tracking-tighter leading-none mb-3">
                SHOWCASE <span class="text-yellow-400">GALLERY</span>
            </h1>
            <p class="text-zinc-400 max-w-md mx-auto">Premium streetwear • Handpicked drops • Real-time management</p>
        </div>

        <!-- PRODUCTS GRID - Matching the sketch layout -->
        <div class="sketch-border bg-zinc-900 p-8 md:p-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                
                <!-- LEFT PRODUCT -->
                <div class="product-card group bg-zinc-950 rounded-3xl overflow-hidden border border-zinc-800">
                    <div class="image-container aspect-square bg-zinc-800 flex items-center justify-center p-12 relative">
                        <div class="text-center">
                            <div class="text-8xl mb-8 transition-transform group-hover:scale-110">👕</div>
                            <div class="absolute top-6 right-6 bg-black/70 text-yellow-400 text-xs font-mono px-3 py-1 rounded-2xl flex items-center gap-x-1">
                                <i class="fa-solid fa-arrow-trend-up"></i>
                                <span class="font-bold">NEW</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <div class="uppercase text-xs tracking-widest text-zinc-500 mb-1">Basic Tee</div>
                                <div class="price-tag text-6xl font-bold text-yellow-400">$59.9</div>
                            </div>
                            <div class="w-14 h-14 bg-zinc-800 rounded-2xl flex items-center justify-center border border-zinc-700">
                                <i class="fa-solid fa-lock text-3xl text-yellow-400"></i>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-center gap-x-8 text-4xl text-zinc-400 py-4 border-t border-zinc-800">
                            <i class="fa-solid fa-shopping-bag hover:text-white transition-colors cursor-pointer"></i>
                        </div>
                    </div>
                </div>

                <!-- RIGHT PRODUCT -->
                <div class="product-card group bg-zinc-950 rounded-3xl overflow-hidden border border-zinc-800">
                    <div class="image-container aspect-square bg-zinc-800 flex items-center justify-center p-12 relative">
                        <div class="text-center">
                            <div class="text-8xl mb-8 transition-transform group-hover:scale-110">👔</div>
                            <div class="absolute top-6 right-6 bg-black/70 text-emerald-400 text-xs font-mono px-3 py-1 rounded-2xl flex items-center gap-x-1">
                                <i class="fa-solid fa-arrow-trend-up"></i>
                                <span class="font-bold">PREMIUM</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <div class="uppercase text-xs tracking-widest text-zinc-500 mb-1">Premium Oxford Shirt</div>
                                <div class="price-tag text-6xl font-bold text-yellow-400">$81.9</div>
                            </div>
                            <div class="flex gap-x-3">
                                <button onclick="this.closest('.product-card').style.opacity='0.4'" 
                                        class="w-14 h-14 bg-zinc-800 hover:bg-red-950 hover:text-red-400 rounded-2xl flex items-center justify-center border border-zinc-700 transition-all">
                                    <i class="fa-solid fa-trash-can text-3xl"></i>
                                </button>
                                <button class="w-14 h-14 bg-zinc-800 hover:bg-amber-950 hover:text-amber-400 rounded-2xl flex items-center justify-center border border-zinc-700 transition-all">
                                    <i class="fa-solid fa-pen-to-square text-3xl"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-center gap-x-8 text-4xl text-zinc-400 py-4 border-t border-zinc-800">
                            <i class="fa-solid fa-check text-emerald-400"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATUS -->
        <div class="
