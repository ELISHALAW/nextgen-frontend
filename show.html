<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/white.png" />
    <title>Product Showcase | NextGen Boutique</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

      body {
        font-family: "Inter", system_ui, sans-serif;
      }

      .title-font {
        font-family: "Space Grotesk", sans-serif;
      }

      .product-card {
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .product-card:hover {
        transform: translateY(-16px) scale(1.02);
        box-shadow: 0 30px 60px -15px rgb(0 0 0 / 0.3);
      }

      .image-container {
        position: relative;
        overflow: hidden;
      }

      .product-image {
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .product-card:hover .product-image {
        transform: scale(1.12);
      }

      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-white min-h-screen">
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-40 py-4 md:py-5">
      <nav
        class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center"
      >
        <a href="./index.html" class="flex items-center gap-3">
          <img
            src="images/white.png"
            class="h-9 md:h-10 w-auto object-contain"
            alt="logo"
          />
        </a>

        <div class="flex items-center gap-6 md:gap-8">
          <a
            href="./index.html"
            class="text-white hover:text-amber-500 transition-colors font-semibold text-sm tracking-widest flex items-center gap-2"
          >
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span class="hidden sm:inline">BACK TO HOME</span>
          </a>

          <a
            href="bag.html"
            class="relative flex items-center gap-2 text-white hover:text-amber-500 transition-colors font-medium group"
          >
            <i class="fa-solid fa-bag-shopping text-2xl"></i>
            <span class="hidden md:inline">Bag</span>
            <span
              id="bag-count"
              class="absolute -top-2 -right-2 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#1A1A1A] hidden"
            >
              0
            </span>
          </a>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-6 md:pt-10 pb-16">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center p-2 rounded-[40px]">
          <span
            class="title-font text-6xl md:text-7xl lg:text-8xl font-bold tracking-tighter leading-none"
          >
            Gimas Studio
          </span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div
          class="product-card group bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800"
        >
          <a
            href="Fashion.html"
            class="image-container block aspect-[4/4.5] bg-zinc-800"
          >
            <img
              src="images/minglong1.jpeg"
              class="product-image w-full h-full object-cover"
              alt="Oversized Tee"
            />

            <div
              class="absolute inset-0 bg-black/50 backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center z-10"
            >
              <h3
                class="title-font text-center w-full px-4 text-white font-bold text-2xl tracking-wide"
              >
                Fashion
              </h3>
            </div>
          </a>
        </div>

        <div
          class="product-card group bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800"
        >
          <a
            href="totebags.html"
            onclick="selectProduct('Totebags', 'images/touchpad.jpeg')"
            class="image-container block aspect-[4/4.5] bg-zinc-800"
          >
            <img
              src="images/touchpad.jpeg"
              class="product-image w-full h-full object-cover"
              alt="Street Cap"
            />

            <div
              class="absolute inset-0 bg-black/50 backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center z-10"
            >
              <h3
                class="title-font text-center w-full px-4 text-white font-bold text-2xl tracking-wide"
              >
                Totebags
              </h3>
            </div>
          </a>
        </div>

        <div
          class="product-card group bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800"
        >
          <a
            href="postcard.html"
            onclick="selectProduct('Postcards', 'images/postcard6.png')"
            class="image-container block aspect-[4/4.5] bg-zinc-800"
          >
            <img
              src="images/postcard6.png"
              class="product-image w-full h-full object-cover"
              alt="Cargo Pants"
            />

            <div
              class="absolute inset-0 bg-black/50 backdrop-blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center z-10"
            >
              <h3
                class="title-font text-center w-full px-4 text-white font-bold text-2xl tracking-wide"
              >
                Postcards
              </h3>
            </div>
          </a>
        </div>
      </div>
    </main>

    <script>
      // Function to pass data into localStorage before redirecting
      function selectProduct(name, image) {
        const selectedProduct = { name: name, image: image };
        localStorage.setItem(
          "selectedProduct",
          JSON.stringify(selectedProduct),
        );
      }

      function updateBagCount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const bagCountBadge = document.getElementById("bag-count");

        if (totalItems > 0) {
          bagCountBadge.textContent = totalItems;
          bagCountBadge.classList.remove("hidden");
        } else {
          bagCountBadge.classList.add("hidden");
        }
      }
      updateBagCount();
    </script>
  </body>
</html>
