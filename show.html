<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/white.png" />
    <title>Collections | Gimas Studio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .title-font {
        font-family: "Space Grotesk", sans-serif;
      }
      /* Optional: Custom scrollbar for a sleeker look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
    </style>
  </head>
  <body
    class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-zinc-800 selection:text-white"
  >
    <!-- Glassmorphism Header -->
    <header
      class="bg-[#09090b]/80 backdrop-blur-md border-b border-zinc-800/50 sticky top-0 z-50 transition-all duration-300"
    >
      <nav
        class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center"
      >
        <a
          href="./index.html"
          class="flex items-center gap-3 group transition-transform active:scale-95"
        >
          <img
            src="images/white.png"
            class="h-9 w-auto object-contain transition-transform duration-500 group-hover:scale-105"
            alt="logo"
          />
        </a>

        <div class="flex items-center gap-8">
          <a
            href="./index.html"
            class="text-zinc-400 hover:text-white transition-colors font-bold text-[11px] tracking-[0.2em] flex items-center gap-2.5 group uppercase"
          >
            <i
              class="fa-solid fa-arrow-left text-[10px] transition-transform group-hover:-translate-x-1"
            ></i>
            <span class="hidden sm:inline">Back to Home</span>
          </a>

          <a
            href="bag.html"
            class="relative flex items-center gap-2.5 text-zinc-400 hover:text-white transition-colors group"
          >
            <i
              class="fa-solid fa-bag-shopping text-xl group-hover:scale-110 transition-transform duration-300"
            ></i>
            <span
              class="hidden md:inline font-bold text-[11px] tracking-[0.2em] uppercase"
              >Bag</span
            >
            <span
              id="bag-count"
              class="absolute -top-1.5 -right-2.5 bg-white text-zinc-950 text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-[#09090b] hidden shadow-sm"
            >
              0
            </span>
          </a>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 pt-16 pb-24 w-full">
      <!-- Hero Section -->
      <div class="flex flex-col items-center text-center mb-20">
        <h1
          class="title-font text-6xl md:text-7xl lg:text-[7rem] font-extrabold tracking-tighter leading-none text-amber-400 mb-6"
        >
          Gimas Studio
        </h1>
        <p
          class="text-xs sm:text-sm text-zinc-400 font-medium tracking-[0.2em] uppercase max-w-xl mx-auto leading-relaxed"
        >
          Everyday gear for doing your own thing.
        </p>
      </div>

      <!-- Product Grid -->
      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8"
      >
        <!-- Card 1: Fashion -->
        <div
          class="group relative rounded-[2rem] overflow-hidden bg-zinc-900 border border-zinc-800/80 transition-all duration-500 ease-out hover:-translate-y-2 hover:border-zinc-600 hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]"
        >
          <a
            href="Fashion.html"
            class="block aspect-[4/5] relative overflow-hidden bg-zinc-950"
          >
            <img
              src="images/minglong1.jpeg"
              class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
              alt="Fashion Collection"
            />

            <!-- Sleek Gradient Overlay -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 transition-opacity duration-500 group-hover:opacity-100"
            ></div>

            <!-- Text Content -->
            <div
              class="absolute inset-0 flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition-transform duration-500 ease-out"
            >
              <h3
                class="title-font text-white font-bold text-3xl tracking-tight mb-2"
              >
                Fashion
              </h3>
              <p
                class="text-[11px] font-bold tracking-[0.2em] uppercase text-zinc-400 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-75"
              >
                View Collection
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </p>
            </div>
          </a>
        </div>

        <!-- Card 2: Totebags -->
        <div
          class="group relative rounded-[2rem] overflow-hidden bg-zinc-900 border border-zinc-800/80 transition-all duration-500 ease-out hover:-translate-y-2 hover:border-zinc-600 hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]"
        >
          <a
            href="totebags.html"
            onclick="selectProduct('Totebags', 'images/touchpad.jpeg')"
            class="block aspect-[4/5] relative overflow-hidden bg-zinc-950"
          >
            <img
              src="images/touchpad.jpeg"
              class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
              alt="Totebags Collection"
            />

            <!-- Sleek Gradient Overlay -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 transition-opacity duration-500 group-hover:opacity-100"
            ></div>

            <!-- Text Content -->
            <div
              class="absolute inset-0 flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition-transform duration-500 ease-out"
            >
              <h3
                class="title-font text-white font-bold text-3xl tracking-tight mb-2"
              >
                Totebags
              </h3>
              <p
                class="text-[11px] font-bold tracking-[0.2em] uppercase text-zinc-400 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-75"
              >
                View Collection
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </p>
            </div>
          </a>
        </div>

        <!-- Card 3: Postcards -->
        <div
          class="group relative rounded-[2rem] overflow-hidden bg-zinc-900 border border-zinc-800/80 transition-all duration-500 ease-out hover:-translate-y-2 hover:border-zinc-600 hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]"
        >
          <a
            href="postcard.html"
            onclick="selectProduct('Postcards', 'images/postcard6.png')"
            class="block aspect-[4/5] relative overflow-hidden bg-zinc-950"
          >
            <img
              src="images/postcard6.png"
              class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105"
              alt="Postcards Collection"
            />

            <!-- Sleek Gradient Overlay -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 transition-opacity duration-500 group-hover:opacity-100"
            ></div>

            <!-- Text Content -->
            <div
              class="absolute inset-0 flex flex-col justify-end p-8 translate-y-4 group-hover:translate-y-0 transition-transform duration-500 ease-out"
            >
              <h3
                class="title-font text-white font-bold text-3xl tracking-tight mb-2"
              >
                Postcards
              </h3>
              <p
                class="text-[11px] font-bold tracking-[0.2em] uppercase text-zinc-400 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-75"
              >
                View Collection
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </p>
            </div>
          </a>
        </div>
      </div>
    </main>

    <script>
      // Function to pass data into localStorage before redirecting
      function selectProduct(name, image) {
        const selectedProduct = { name: name, image: image };
        localStorage.setItem(
          "selectedProduct",
          JSON.stringify(selectedProduct),
        );
      }

      // Dynamic Bag Counter
      function updateBagCount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const bagCountBadge = document.getElementById("bag-count");

        if (totalItems > 0) {
          bagCountBadge.textContent = totalItems;
          bagCountBadge.classList.remove("hidden");
        } else {
          bagCountBadge.classList.add("hidden");
        }
      }

      // Initialize layout
      updateBagCount();
    </script>
  </body>
</html>
