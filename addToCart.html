<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .option-btn {
        transition: all 0.2s ease;
      }
      .option-btn.active {
        background-color: #1a1a1a;
        color: white;
        border-color: #1a1a1a;
      }

      .product-image-container {
        aspect-ratio: 4 / 4.2;
      }

      /* Quantity Button Improvements */
      .qty-btn {
        transition: all 0.2s ease;
      }
      .qty-btn:hover {
        background-color: #f3f4f6;
      }
      .qty-btn:active {
        transform: scale(0.95);
      }
      .qty-decrease:disabled {
        color: #d1d5db;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-40 py-4 md:py-5">
      <nav
        class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center"
      >
        <a href="./index.html" class="flex items-center gap-3 group">
          <img
            id="nav-logo"
            src="images/white.png"
            class="h-14 w-auto object-contain transition-transform duration-500 group-hover:scale-105"
            alt="logo"
          />
        </a>

        <div class="flex items-center gap-6 md:gap-8">
          <a
            href="index.html"
            class="text-white hover:text-amber-500 transition-colors font-semibold text-sm tracking-widest flex items-center gap-2"
          >
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span class="hidden sm:inline">BACK TO HOME</span>
          </a>

          <a
            href="bag.html"
            class="relative flex items-center gap-2 text-white hover:text-amber-500 transition-colors font-medium group"
          >
            <i class="fa-solid fa-bag-shopping text-2xl"></i>
            <span class="hidden md:inline">Bag</span>
            <span
              id="bag-count"
              class="absolute -top-2 -right-2 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#1A1A1A] hidden"
              >0</span
            >
          </a>
        </div>
      </nav>
    </header>

    <main
      class="flex-1 w-full px-4 md:px-6 py-8 md:py-16 flex items-center justify-center"
    >
      <div class="max-w-5xl w-full mx-auto">
        <div
          class="bg-white rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.02)] border border-slate-100 overflow-hidden"
        >
          <div class="grid grid-cols-1 md:grid-cols-12">
            <div
              class="md:col-span-6 p-6 lg:p-10 bg-[#FAFAFA] flex items-center justify-center border-b md:border-b-0 md:border-r border-slate-100/80"
            >
              <div
                class="w-full max-w-sm aspect-[4/5] rounded-2xl overflow-hidden shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200/50 bg-white group"
              >
                <img
                  id="product-img"
                  src=""
                  alt="Product Image"
                  class="w-full h-full object-cover object-center transition-transform duration-700 ease-out group-hover:scale-102"
                />
              </div>
            </div>

            <div
              class="md:col-span-6 p-8 lg:p-12 flex flex-col justify-between"
            >
              <div>
                <div class="flex justify-between items-start gap-4 mb-6">
                  <div>
                    <span
                      id="product-brand"
                      class="text-[11px] font-bold tracking-[0.2em] text-slate-400 uppercase block mb-1"
                    >
                      NEXTGEN
                    </span>
                    <h1
                      id="product-title"
                      class="font-bold text-2xl lg:text-3xl tracking-tight text-slate-900 uppercase leading-tight"
                    >
                      STREETWEAR ITEM
                    </h1>
                  </div>
                  <p
                    id="product-price"
                    class="font-semibold text-2xl lg:text-3xl text-slate-900 tracking-tight"
                  >
                    RM 0.00
                  </p>
                </div>

                <div class="w-full h-px bg-slate-100 my-6"></div>

                <div class="space-y-6">
                  <div id="size-group">
                    <p
                      class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5"
                    >
                      Select Size
                    </p>
                    <div class="flex flex-wrap gap-2.5">
                      <button
                        type="button"
                        data-size="M"
                        class="size-option option-btn h-11 px-5 border border-slate-950 rounded-xl text-xs font-semibold bg-slate-950 text-white shadow-sm min-w-[56px] tracking-wider transition-all"
                      >
                        M
                      </button>
                      <button
                        type="button"
                        data-size="L"
                        class="size-option option-btn h-11 px-5 border border-slate-200 rounded-xl text-xs font-semibold bg-white text-slate-800 hover:border-slate-400 shadow-sm min-w-[56px] tracking-wider transition-all"
                      >
                        L
                      </button>
                    </div>
                  </div>

                  <div id="color-group">
                    <p
                      class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2.5"
                    >
                      Select Color
                    </p>
                    <div class="flex flex-wrap gap-2.5">
                      <button
                        type="button"
                        data-color="Natural"
                        class="color-option option-btn h-11 px-5 border border-slate-950 rounded-xl text-xs font-semibold bg-slate-950 text-white shadow-sm transition-all"
                      >
                        Natural
                      </button>
                      <button
                        type="button"
                        data-color="Black"
                        class="color-option option-btn h-11 px-5 border border-slate-200 rounded-xl text-xs font-semibold bg-white text-slate-800 hover:border-slate-400 shadow-sm transition-all"
                      >
                        Black
                      </button>
                    </div>
                  </div>
                </div>

                <div
                  class="mt-6 bg-slate-50/80 border border-slate-100 rounded-xl px-4 py-2.5 inline-flex items-center gap-1.5 text-xs text-slate-500 font-medium"
                >
                  <span>Selected:</span>
                  <span
                    id="selection-summary"
                    class="text-slate-900 font-semibold"
                    >M / Natural</span
                  >
                </div>
              </div>

              <div class="mt-8 pt-6 border-t border-slate-100/80 space-y-5">
                <div>
                  <p
                    class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2"
                  >
                    Quantity
                  </p>
                  <div
                    class="flex items-center justify-between border border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm h-12 w-full sm:w-32 transition-all focus-within:border-slate-400"
                  >
                    <button
                      type="button"
                      id="btn-decrease"
                      disabled
                      class="w-10 h-full flex items-center justify-center text-slate-400 hover:bg-slate-50 active:bg-slate-100/80 disabled:opacity-25 disabled:hover:bg-transparent transition-colors"
                      aria-label="Decrease quantity"
                    >
                      <i class="fa-solid fa-minus text-[10px]"></i>
                    </button>
                    <span
                      id="quantity-display"
                      class="flex-1 text-center font-bold text-xs text-slate-900 select-none"
                      >1</span
                    >
                    <button
                      type="button"
                      id="btn-increase"
                      class="w-10 h-full flex items-center justify-center text-slate-400 hover:bg-slate-50 active:bg-slate-100/80 transition-colors"
                      aria-label="Increase quantity"
                    >
                      <i class="fa-solid fa-plus text-[10px]"></i>
                    </button>
                  </div>
                </div>

                <button
                  type="button"
                  id="btn-add-to-cart"
                  class="w-full bg-slate-950 hover:bg-slate-850 text-white font-semibold text-xs tracking-wider uppercase h-12 rounded-xl transition-all active:scale-[0.99] shadow-sm flex items-center justify-center gap-2"
                >
                  <i
                    class="fa-solid fa-basket-shopping text-[11px] opacity-90"
                  ></i>
                  Confirm Variant & Add
                </button>

                <div
                  class="flex items-center gap-2 text-[11px] font-semibold text-emerald-700 bg-emerald-50/60 border border-emerald-100/50 w-fit px-3 py-1.5 rounded-lg"
                >
                  <span class="relative flex h-1.5 w-1.5">
                    <span
                      class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
                    ></span>
                    <span
                      class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"
                    ></span>
                  </span>
                  In Stock & Ready to Ship
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Safe isolated script execution scope environment
      document.addEventListener("DOMContentLoaded", () => {
        const selectedProduct = JSON.parse(
          localStorage.getItem("selectedProduct"),
        );

        if (!selectedProduct) {
          alert("No item selected! Returning to showroom gallery list.");
          window.location.href = "index.html";
          return;
        }

        let currentSize = "M";
        let currentColor = "Natural";
        let quantity = 1;

        // Cache DOM Elements safely
        const qtyDisplay = document.getElementById("quantity-display");
        const decreaseBtn = document.getElementById("btn-decrease");
        const increaseBtn = document.getElementById("btn-increase");
        const addToCartBtn = document.getElementById("btn-add-to-cart");
        const summaryEl = document.getElementById("selection-summary");

        function renderPageData() {
          const imgEl = document.getElementById("product-img");
          const priceEl = document.getElementById("product-price");
          const brandEl = document.getElementById("product-brand");
          const titleEl = document.getElementById("product-title");

          if (imgEl) {
            imgEl.src = selectedProduct.image;
            imgEl.alt = selectedProduct.name;
          }
          if (priceEl) {
            priceEl.textContent = `RM ${selectedProduct.price.toFixed(2)}`;
          }

          const nameParts = selectedProduct.name.split(" ");
          if (nameParts.length > 1) {
            if (brandEl) brandEl.textContent = nameParts[0];
            if (titleEl) titleEl.textContent = nameParts.slice(1).join(" ");
          } else {
            if (brandEl) brandEl.textContent = "DESIGN";
            if (titleEl) titleEl.textContent = selectedProduct.name;
          }
        }

        // Modern styling visual toggle logic handler
        function updateButtonVisuals(buttonsList, selectedButton) {
          buttonsList.forEach((btn) => {
            btn.className =
              "option-btn h-11 px-5 border border-slate-200 rounded-xl text-xs font-semibold bg-white text-slate-800 hover:border-slate-400 shadow-sm min-w-[56px] tracking-wider transition-all";
          });
          selectedButton.className =
            "option-btn h-11 px-5 border border-slate-950 rounded-xl text-xs font-semibold bg-slate-950 text-white shadow-sm min-w-[56px] tracking-wider transition-all";
        }

        // Attach Event Listeners to Sizes
        const sizeButtons = document.querySelectorAll(".size-option");
        sizeButtons.forEach((button) => {
          button.addEventListener("click", (e) => {
            updateButtonVisuals(sizeButtons, e.currentTarget);
            currentSize = e.currentTarget.getAttribute("data-size");
            updateSelectionSummary();
          });
        });

        // Attach Event Listeners to Colors
        const colorButtons = document.querySelectorAll(".color-option");
        colorButtons.forEach((button) => {
          button.addEventListener("click", (e) => {
            updateButtonVisuals(colorButtons, e.currentTarget);
            currentColor = e.currentTarget.getAttribute("data-color");
            updateSelectionSummary();
          });
        });

        function updateSelectionSummary() {
          if (summaryEl) {
            summaryEl.textContent = `${currentSize} / ${currentColor}`;
          }
        }

        // Quantity Handlers via Event Listeners
        if (increaseBtn) {
          increaseBtn.addEventListener("click", () => {
            quantity++;
            qtyDisplay.textContent = quantity;
            decreaseBtn.disabled = false;
          });
        }

        if (decreaseBtn) {
          decreaseBtn.addEventListener("click", () => {
            if (quantity > 1) {
              quantity--;
              qtyDisplay.textContent = quantity;
              if (quantity === 1) {
                decreaseBtn.disabled = true;
              }
            }
          });
        }

        function updateHeaderCount() {
          // Named uniquely to completely prevent global scope namespace collision crashes
          const uniquePageCartItems =
            JSON.parse(localStorage.getItem("cart")) || [];
          const totalItems = uniquePageCartItems.reduce(
            (sum, item) => sum + item.quantity,
            0,
          );
          const badge = document.getElementById("bag-count");

          if (badge) {
            if (totalItems > 0) {
              badge.textContent = totalItems;
              badge.classList.remove("hidden");
            } else {
              badge.classList.add("hidden");
            }
          }
        }

        if (addToCartBtn) {
          addToCartBtn.addEventListener("click", () => {
            const uniquePageCartItems =
              JSON.parse(localStorage.getItem("cart")) || [];

            const existingItemIndex = uniquePageCartItems.findIndex(
              (item) =>
                item.id === selectedProduct.id &&
                item.size === currentSize &&
                item.color === currentColor,
            );

            if (existingItemIndex > -1) {
              uniquePageCartItems[existingItemIndex].quantity += quantity;
            } else {
              uniquePageCartItems.push({
                id: selectedProduct.id,
                name: selectedProduct.name,
                price: selectedProduct.price,
                image: selectedProduct.image,
                size: currentSize,
                color: currentColor,
                quantity: quantity,
              });
            }

            localStorage.setItem("cart", JSON.stringify(uniquePageCartItems));
            updateHeaderCount();

            alert(
              `Added ${quantity}x ${selectedProduct.name} (${currentSize} / ${currentColor}) to your bag!`,
            );
          });
        }

        // Run Initializations
        renderPageData();
        updateHeaderCount();
        updateSelectionSummary();
      });
    </script>
  </body>
</html>
