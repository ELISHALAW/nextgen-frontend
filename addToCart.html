<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .option-btn {
        transition: all 0.2s ease;
      }
      .option-btn.active {
        background-color: #1a1a1a;
        color: white;
        border-color: #1a1a1a;
      }

      .product-image-container {
        aspect-ratio: 4 / 4.2;
      }

      /* Quantity Button Improvements */
      .qty-btn {
        transition: all 0.2s ease;
      }
      .qty-btn:hover {
        background-color: #f3f4f6;
      }
      .qty-btn:active {
        transform: scale(0.95);
      }
      .qty-decrease:disabled {
        color: #d1d5db;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <header class="bg-[#1A1A1A] shadow-lg sticky top-0 z-40 py-4 md:py-5">
      <nav
        class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center"
      >
        <a href="./index.html" class="flex items-center gap-3 group">
          <img
            id="nav-logo"
            src="images/white.png"
            class="h-14 w-auto object-contain transition-transform duration-500 group-hover:scale-105"
            alt="logo"
          />
        </a>

        <div class="flex items-center gap-6 md:gap-8">
          <a
            href="index.html"
            class="text-white hover:text-amber-500 transition-colors font-semibold text-sm tracking-widest flex items-center gap-2"
          >
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span class="hidden sm:inline">BACK TO HOME</span>
          </a>

          <a
            href="bag.html"
            class="relative flex items-center gap-2 text-white hover:text-amber-500 transition-colors font-medium group"
          >
            <i class="fa-solid fa-bag-shopping text-2xl"></i>
            <span class="hidden md:inline">Bag</span>
            <span
              id="bag-count"
              class="absolute -top-2 -right-2 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-[#1A1A1A] hidden"
              >0</span
            >
          </a>
        </div>
      </nav>
    </header>

    <main class="flex-1 w-full px-4 md:px-6 py-8 md:py-12">
      <div class="max-w-6xl mx-auto">
        <div
          class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden"
        >
          <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
            <div class="lg:w-[520px] flex-shrink-0 px-4 pt-4 lg:p-0">
              <div
                class="product-image-container w-full bg-gray-50 rounded-3xl overflow-hidden shadow-inner h-[520px] lg:h-[653px]"
              >
                <img
                  id="product-img"
                  src=""
                  alt="Product Image"
                  class="w-full h-full object-cover object-center hover:scale-105 transition-transform duration-700"
                />
              </div>
            </div>

            <div
              class="flex-1 px-4 pb-8 lg:p-0 lg:pr-10 flex flex-col justify-center"
            >
              <div class="flex justify-between items-start mt-2 lg:mt-0">
                <div>
                  <h3
                    id="product-brand"
                    class="font-extrabold text-4xl md:text-5xl lg:text-6xl uppercase tracking-tighter text-gray-900"
                  >
                    NEXTGEN
                  </h3>
                  <h4
                    id="product-title"
                    class="font-extrabold text-2xl md:text-3xl lg:text-4xl uppercase tracking-tight text-gray-500 -mt-1"
                  >
                    STREETWEAR ITEM
                  </h4>
                </div>
                <div class="text-right">
                  <p
                    id="product-price"
                    class="font-black text-4xl md:text-5xl text-amber-600"
                  >
                    $0.00
                  </p>
                </div>
              </div>

              <div class="mt-8">
                <p
                  class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3"
                >
                  Size
                </p>
                <div class="flex gap-3">
                  <button
                    onclick="selectSize(this)"
                    class="option-btn active px-7 py-3.5 border-2 border-gray-300 rounded-2xl text-lg font-semibold min-w-[60px]"
                  >
                    M
                  </button>
                  <button
                    onclick="selectSize(this)"
                    class="option-btn px-7 py-3.5 border-2 border-gray-300 rounded-2xl text-lg font-semibold min-w-[60px]"
                  >
                    L
                  </button>
                </div>
              </div>

              <div class="mt-8">
                <p
                  class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3"
                >
                  Color
                </p>
                <div class="flex gap-3">
                  <button
                    onclick="selectColor(this)"
                    class="option-btn active px-7 py-3.5 border-2 border-gray-300 rounded-2xl text-lg font-semibold"
                  >
                    Natural
                  </button>
                  <button
                    onclick="selectColor(this)"
                    class="option-btn px-7 py-3.5 border-2 border-gray-300 rounded-2xl text-lg font-semibold"
                  >
                    Black
                  </button>
                </div>
              </div>

              <p id="selection" class="text-gray-500 mt-6 text-base md:text-lg">
                Size: <span class="text-gray-700 font-medium">M</span> | Color:
                <span class="text-gray-700 font-medium">Natural</span>
              </p>

              <div class="mt-8 pt-6 border-t border-gray-100">
                <label
                  class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3"
                  >Quantity</label
                >
                <div
                  class="flex items-center gap-2 bg-gray-50 border-2 border-gray-100 rounded-3xl p-2 w-fit"
                >
                  <button
                    id="decrease-btn"
                    onclick="decreaseQty()"
                    class="qty-btn qty-decrease w-12 h-12 flex items-center justify-center text-3xl font-light text-gray-600 rounded-2xl hover:bg-white transition-all"
                  >
                    −
                  </button>

                  <span
                    id="quantity"
                    class="font-black text-3xl w-16 text-center text-gray-800"
                    >1</span
                  >

                  <button
                    onclick="increaseQty()"
                    class="qty-btn w-12 h-12 flex items-center justify-center text-3xl font-light text-gray-600 rounded-2xl hover:bg-white transition-all"
                  >
                    +
                  </button>
                </div>
              </div>

              <span
                class="mt-6 inline-block text-base font-bold text-green-600 bg-green-50 px-6 py-3 rounded-full uppercase tracking-wider text-xs"
              >
                In Stock & Ready
              </span>

              <button
                onclick="addToCart()"
                class="mt-10 w-full bg-[#1A1A1A] hover:bg-black text-white font-bold text-lg py-5 rounded-2xl transition-all active:scale-[0.97] flex items-center justify-center gap-3 shadow-lg"
              >
                <i class="fa-solid fa-cart-plus"></i> CONFIRM VARIANT & ADD
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Read selected product
      const selectedProduct = JSON.parse(
        localStorage.getItem("selectedProduct"),
      );

      if (!selectedProduct) {
        alert("No item selected! Returning to showroom gallery list.");
        window.location.href = "index.html";
      }

      let currentSize = "M";
      let currentColor = "Natural";
      let quantity = 1;

      function renderPageData() {
        document.getElementById("product-img").src = selectedProduct.image;
        document.getElementById("product-img").alt = selectedProduct.name;
        document.getElementById("product-price").textContent =
          `$${selectedProduct.price.toFixed(2)}`;

        const nameParts = selectedProduct.name.split(" ");
        if (nameParts.length > 1) {
          document.getElementById("product-brand").textContent = nameParts[0];
          document.getElementById("product-title").textContent = nameParts
            .slice(1)
            .join(" ");
        } else {
          document.getElementById("product-brand").textContent = "DESIGN";
          document.getElementById("product-title").textContent =
            selectedProduct.name;
        }
      }

      function selectSize(btn) {
        document.querySelectorAll(".option-btn").forEach((b) => {
          if (["M", "L"].includes(b.textContent.trim()))
            b.classList.remove("active");
        });
        btn.classList.add("active");
        currentSize = btn.textContent.trim();
        updateSelection();
      }

      function selectColor(btn) {
        document.querySelectorAll(".option-btn").forEach((b) => {
          if (["Natural", "Black"].includes(b.textContent.trim()))
            b.classList.remove("active");
        });
        btn.classList.add("active");
        currentColor = btn.textContent.trim();
        updateSelection();
      }

      function updateSelection() {
        document.getElementById("selection").innerHTML = `
          Size: <span class="text-gray-700 font-medium">${currentSize}</span> | 
          Color: <span class="text-gray-700 font-medium">${currentColor}</span>
        `;
      }

      function increaseQty() {
        quantity++;
        document.getElementById("quantity").textContent = quantity;
        document.getElementById("decrease-btn").disabled = false;
      }

      function decreaseQty() {
        if (quantity > 1) {
          quantity--;
          document.getElementById("quantity").textContent = quantity;

          if (quantity === 1) {
            document.getElementById("decrease-btn").disabled = true;
          }
        }
      }

      function updateHeaderCount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById("bag-count");

        if (totalItems > 0) {
          badge.textContent = totalItems;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }
      }

      function addToCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let existingItemIndex = cart.findIndex(
          (item) =>
            item.id === selectedProduct.id &&
            item.size === currentSize &&
            item.color === currentColor,
        );

        if (existingItemIndex > -1) {
          cart[existingItemIndex].quantity += quantity;
        } else {
          cart.push({
            id: selectedProduct.id,
            name: selectedProduct.name,
            price: selectedProduct.price,
            image: selectedProduct.image,
            size: currentSize,
            color: currentColor,
            quantity: quantity,
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        updateHeaderCount();

        alert(
          `Added ${quantity}x ${selectedProduct.name} (${currentSize} / ${currentColor}) to your bag!`,
        );
      }

      // Initialize
      renderPageData();
      updateHeaderCount();
    </script>
  </body>
</html>
