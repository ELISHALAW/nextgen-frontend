<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Premium Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/white.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .option-btn {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .option-btn.active {
        background-color: #0f172a;
        color: white;
        border-color: #0f172a;
        box-shadow: 0 4px 14px 0 rgba(15, 23, 42, 0.2);
        transform: translateY(-1px);
      }
      .toast-enter {
        transform: translateY(0);
        opacity: 1;
      }
      .toast-exit {
        transform: translateY(100%);
        opacity: 0;
      }
      /* Custom scrollbar for better overall look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body
    class="bg-[#F4F5F7] text-slate-900 min-h-screen flex flex-col selection:bg-slate-900 selection:text-white"
  >
    <header class="bg-[#1A1A1A] shadow-md sticky top-0 z-40 py-4 md:py-5">
      <nav class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <a href="./index.html" class="flex items-center gap-3 group">
          <img
            id="nav-logo"
            src="images/white.png"
            class="h-10 w-auto object-contain"
            alt="Logo"
            onerror="this.src = 'https://via.placeholder.com/150x50?text=LOGO'"
          />
        </a>
        <div class="flex items-center gap-8">
          <a
            href="index.html"
            class="text-slate-300 hover:text-white font-semibold text-xs tracking-widest uppercase transition-colors"
          >
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Home
          </a>
          <a
            href="bag.html"
            class="relative text-white hover:text-slate-300 transition-colors"
          >
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span
              id="bag-count"
              class="absolute -top-2 -right-2.5 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden"
              >0</span
            >
          </a>
        </div>
      </nav>
    </header>

    <main
      class="flex-1 w-full px-4 py-12 md:py-16 flex items-center justify-center"
    >
      <div
        class="max-w-6xl w-full bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-6 sm:p-10 md:p-14"
      >
        <div
          class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center"
        >
          <div
            class="relative w-full aspect-square md:aspect-auto md:h-[600px] bg-gradient-to-br from-slate-50 to-slate-100 rounded-3xl flex items-center justify-center p-8 group overflow-hidden shadow-inner border border-slate-50"
          >
            <div
              class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-slate-200/50 rounded-full blur-3xl -z-10 group-hover:scale-110 transition-transform duration-700 ease-in-out"
            ></div>

            <img
              id="product-img"
              src=""
              alt="Product Image"
              class="w-full max-w-md object-contain mix-blend-multiply drop-shadow-2xl transition-transform duration-500 group-hover:scale-[1.03]"
            />
          </div>

          <div class="flex flex-col justify-center max-w-lg">
            <div class="mb-8">
              <div
                class="inline-flex items-center gap-2 px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-[10px] font-bold uppercase tracking-widest mb-6"
              >
                <i class="fa-solid fa-star text-amber-500 text-[8px]"></i>
                Premium Design
              </div>
              <h1
                id="product-title"
                class="font-extrabold text-4xl sm:text-5xl text-slate-900 tracking-tight leading-[1.1] mb-4 uppercase"
              ></h1>
              <p
                id="product-price"
                class="text-3xl font-semibold text-slate-900 flex items-center gap-2"
              ></p>
            </div>

            <hr class="border-slate-100 mb-8" />

            <div class="space-y-8">
              <div id="size-group">
                <div class="flex justify-between items-end mb-4">
                  <p
                    class="text-xs font-bold text-slate-500 uppercase tracking-widest"
                  >
                    Select Size
                  </p>
                  <a
                    href="#"
                    class="text-[10px] font-semibold text-slate-400 hover:text-slate-900 underline underline-offset-4 transition-colors"
                    >Size Guide</a
                  >
                </div>
                <div class="flex flex-wrap gap-3">
                  <button
                    type="button"
                    data-size="M"
                    class="size-option option-btn active h-12 w-16 border-2 rounded-xl bg-white border-slate-200 text-slate-700 text-sm font-bold hover:border-slate-400 focus:outline-none"
                  >
                    M
                  </button>
                  <button
                    type="button"
                    data-size="L"
                    class="size-option option-btn h-12 w-16 border-2 rounded-xl bg-white border-slate-200 text-slate-700 text-sm font-bold hover:border-slate-400 focus:outline-none"
                  >
                    L
                  </button>
                </div>
              </div>

              <div id="color-group">
                <p
                  class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4"
                >
                  Select Color
                </p>
                <div class="flex flex-wrap gap-3">
                  <button
                    type="button"
                    data-color="Natural"
                    class="color-option option-btn active h-12 px-8 border-2 rounded-xl bg-white border-slate-200 text-slate-700 text-sm font-bold hover:border-slate-400 focus:outline-none"
                  >
                    Natural
                  </button>
                  <button
                    type="button"
                    data-color="Black"
                    class="color-option option-btn h-12 px-8 border-2 rounded-xl bg-white border-slate-200 text-slate-700 text-sm font-bold hover:border-slate-400 focus:outline-none"
                  >
                    Black
                  </button>
                </div>
              </div>

              <div>
                <p
                  class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4"
                >
                  Quantity
                </p>
                <div
                  class="flex items-center border-2 border-slate-200 w-fit rounded-xl overflow-hidden bg-white shadow-sm"
                >
                  <button
                    id="qty-minus"
                    class="w-12 h-12 flex items-center justify-center hover:bg-slate-50 hover:text-slate-900 transition-colors text-slate-500 focus:outline-none"
                  >
                    <i class="fa-solid fa-minus text-xs"></i>
                  </button>
                  <span
                    id="qty-val"
                    class="w-12 text-center font-bold text-slate-900 text-base select-none"
                    >1</span
                  >
                  <button
                    id="qty-plus"
                    class="w-12 h-12 flex items-center justify-center hover:bg-slate-50 hover:text-slate-900 transition-colors text-slate-500 focus:outline-none"
                  >
                    <i class="fa-solid fa-plus text-xs"></i>
                  </button>
                </div>
              </div>

              <div class="pt-4 mt-8 border-t border-slate-100">
                <button
                  id="btn-add-to-cart"
                  class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl text-sm tracking-widest hover:bg-slate-800 hover:shadow-[0_8px_20px_rgba(15,23,42,0.25)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-3 uppercase group"
                >
                  <i
                    class="fa-solid fa-bag-shopping text-base group-hover:scale-110 transition-transform"
                  ></i>
                  Confirm Variant & Add to Bag
                </button>

                <div
                  class="mt-6 flex items-center justify-center gap-2 text-emerald-600 bg-emerald-50/50 py-2.5 px-4 rounded-xl text-xs font-bold tracking-wide"
                >
                  <span class="relative flex h-2.5 w-2.5">
                    <span
                      class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
                    ></span>
                    <span
                      class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"
                    ></span>
                  </span>
                  IN STOCK & READY TO SHIP
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      id="toast"
      class="fixed bottom-6 right-6 bg-slate-900 text-white p-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.2)] flex items-center gap-4 z-50 transition-all duration-300 toast-exit pointer-events-none min-w-[280px]"
    >
      <div
        class="bg-emerald-500/20 text-emerald-400 rounded-full w-10 h-10 flex items-center justify-center shrink-0"
      >
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <p class="font-bold text-sm">Added to Bag</p>
        <p id="toast-msg" class="text-xs text-slate-400 mt-1 line-clamp-1"></p>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const selectedProduct = JSON.parse(
          localStorage.getItem("selectedProduct"),
        );
        if (!selectedProduct) {
          window.location.href = "index.html";
          return;
        }

        let currentSize = "M",
          currentColor = "Natural",
          quantity = 1;

        // --- UI Initialization ---
        document.getElementById("product-img").src = selectedProduct.image;
        document.getElementById("product-title").textContent =
          selectedProduct.name;
        document.getElementById("product-price").textContent =
          `RM ${selectedProduct.price.toFixed(2)}`;

        // --- NEW SIZE LOGIC ---
        // By default, we hide the size selector to prevent bugs with mismatched dummy data.
        let productHasSize = false;
        const productName = (selectedProduct.name || "").toLowerCase();

        // Only show size if your database explicitly flags it as clothing,
        // OR if the title has "tee" or "shirt".
        if (
          selectedProduct.isClothing === true ||
          productName.includes("tee") ||
          productName.includes("shirt")
        ) {
          productHasSize = true;
        }

        if (!productHasSize) {
          document.getElementById("size-group").classList.add("hidden");
          currentSize = null; // Clear size value so it doesn't get added to the cart data
        } else {
          document.getElementById("size-group").classList.remove("hidden");
        }

        // Color will always show
        document.getElementById("color-group").classList.remove("hidden");

        // --- Bag Counter Logic ---
        function updateBagCount() {
          const cart = JSON.parse(localStorage.getItem("cart")) || [];
          const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
          const bagCountEl = document.getElementById("bag-count");

          if (totalQty > 0) {
            bagCountEl.textContent = totalQty;
            bagCountEl.classList.remove("hidden");
          } else {
            bagCountEl.classList.add("hidden");
          }
        }
        updateBagCount();

        // --- Quantity Logic ---
        const qtyValEl = document.getElementById("qty-val");
        document.getElementById("qty-plus").addEventListener("click", () => {
          quantity++;
          qtyValEl.textContent = quantity;
        });
        document.getElementById("qty-minus").addEventListener("click", () => {
          if (quantity > 1) {
            quantity--;
            qtyValEl.textContent = quantity;
          }
        });

        // --- Variant Selection Logic ---
        function handleSelection(buttons, type, value, el) {
          buttons.forEach((btn) => btn.classList.remove("active"));
          el.classList.add("active");
          if (type === "size") currentSize = value;
          if (type === "color") currentColor = value;
        }

        document
          .querySelectorAll(".size-option")
          .forEach((btn) =>
            btn.addEventListener("click", (e) =>
              handleSelection(
                document.querySelectorAll(".size-option"),
                "size",
                e.target.dataset.size,
                e.currentTarget,
              ),
            ),
          );

        document
          .querySelectorAll(".color-option")
          .forEach((btn) =>
            btn.addEventListener("click", (e) =>
              handleSelection(
                document.querySelectorAll(".color-option"),
                "color",
                e.target.dataset.color,
                e.currentTarget,
              ),
            ),
          );

        // --- Toast Notification Logic ---
        let toastTimeout;
        function showToast(productName, qty) {
          const toast = document.getElementById("toast");
          document.getElementById("toast-msg").textContent =
            `${qty}x ${productName}`;

          toast.classList.remove("toast-exit");
          toast.classList.add("toast-enter");

          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            toast.classList.remove("toast-enter");
            toast.classList.add("toast-exit");
          }, 3000);
        }

        // --- Add to Cart Action ---
        document
          .getElementById("btn-add-to-cart")
          .addEventListener("click", () => {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];

            const existingItemIndex = cart.findIndex(
              (item) =>
                item.id === selectedProduct.id &&
                item.size === currentSize &&
                item.color === currentColor,
            );

            if (existingItemIndex > -1) {
              cart[existingItemIndex].quantity += quantity;
            } else {
              cart.push({
                ...selectedProduct,
                size: currentSize,
                color: currentColor,
                quantity: quantity,
              });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            updateBagCount();
            showToast(selectedProduct.name, quantity);
          });
      });
    </script>
  </body>
</html>
